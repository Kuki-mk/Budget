  async delRecurring(d) { const x = byId(App.state.recurring, d.id); if (x && (await askConfirm({ title: `„${x.name}“ löschen?`, text: 'Der Eintrag wird aus allen Prognosen entfernt.', ok: 'Löschen', danger: true })).ok) { App.state.recurring = App.state.recurring.filter(i => i.id !== d.id); commit(); toast('Gelöscht'); } },
  async delOneoff(d) { const x = byId(App.state.oneoffs, d.id); if (x && (await askConfirm({ title: `„${x.name}“ löschen?`, ok: 'Löschen', danger: true })).ok) { App.state.oneoffs = App.state.oneoffs.filter(i => i.id !== d.id); commit(); toast('Gelöscht'); } },
  async delInvoice(d) { const x = byId(App.state.invoices, d.id); if (x && (await askConfirm({ title: `„${x.name}“ löschen?`, ok: 'Löschen', danger: true })).ok) { App.state.invoices = App.state.invoices.filter(i => i.id !== d.id); commit(); toast('Gelöscht'); } },
  async delInstallment(d) { const x = byId(App.state.installments, d.id); if (x && (await askConfirm({ title: `„${x.name}“ löschen?`, ok: 'Löschen', danger: true })).ok) { App.state.installments = App.state.installments.filter(i => i.id !== d.id); commit(); toast('Gelöscht'); } },
  async payInvoice(d) {
    const inv = byId(App.state.invoices, d.id); if (!inv) return;
    const r = await askConfirm({ title: `„${inv.name}“ als bezahlt markieren?`, text: `Betrag: ${fmtEUR(inv.amount)}. Die Rechnung verschwindet aus dem Plan.`, ok: 'Als bezahlt markieren', check: { label: `Kontostand um ${fmtEUR(inv.amount)} verringern`, checked: true } });
    if (!r.ok) return;
    inv.paid = true; inv.paidDate = todayISO();
    journalToday({ kind: 'invoice', title: `${inv.name}${inv.provider ? ` (${inv.provider})` : ''}`, amount: -inv.amount, ref: { type: 'invoice', id: inv.id }, balanceAdj: !!r.checked });
    if (r.checked) setBalance(App.state.settings.balance - inv.amount);
    commit(); toast('Als bezahlt markiert.' + startHint());
  },
  async payInstallment(d) {
    const it = byId(App.state.installments, d.id); if (!it) return;
    const interest = it.balance * (it.rate || 0) / 1200;
    const amt = Math.min(it.payment, it.balance + interest);
    const r = await askConfirm({ title: `Rate für „${it.name}“ als bezahlt buchen?`, text: `Rate: ${fmtEUR(amt)}${interest > 0 ? `, davon ca. ${fmtEUR(interest)} Zinsen` : ''}. Die Restschuld sinkt und die nächste Rate rückt einen Monat weiter.`, ok: 'Rate buchen', check: { label: `Kontostand um ${fmtEUR(amt)} verringern`, checked: true } });
    if (!r.ok) return;
    const oldBalance = it.balance, prevNextDue = it.nextDue;
    it.balance = round2(Math.max(0, it.balance + interest - amt));
    const anchor = it.anchorDay || parseISO(it.nextDue).d;
    it.nextDue = fromDayNum(nextAnchorAfter(dayNum(it.nextDue), anchor));
    journalToday({ kind: 'rate', title: `Rate: ${it.name}`, amount: -amt, ref: { type: 'installment', id: it.id, dBalance: round2(oldBalance - it.balance), prevNextDue }, balanceAdj: !!r.checked });
    if (r.checked) setBalance(App.state.settings.balance - amt);
    commit(); toast((it.balance <= 0.005 ? 'Abbezahlt. Glückwunsch!' : 'Rate gebucht.') + startHint());
    if (it.balance <= 0.005) Fx.confetti();
  },
  prepayInstallment(d) {
    const it = byId(App.state.installments, d.id); if (!it) return;
    const P = getPlan();
    const planned = P.opt.log.find(e => e.type === 'prepay' && e.id === it.id && e.i <= 31);
    openForm({
      title: `Sondertilgung für „${it.name}“`, submit: 'Sondertilgung buchen',
      intro: `<p>Restschuld aktuell ${esc(fmtEUR(it.balance))}.${planned ? ` Die Strategie schlägt ${esc(fmtEUR(-planned.amount))} am ${esc(fmtDate(P.dateAt(planned.i)))} vor.` : ' Aktuell ist laut Plan keine Sondertilgung vorgesehen.'}</p>`,
      values: { amount: planned ? -planned.amount : '', adjust: true },
      fields: [{ key: 'amount', label: 'Betrag', type: 'money', required: true }, { key: 'adjust', label: 'Kontostand um diesen Betrag verringern', type: 'checkbox' }],
      onSubmit: x => {
        if (!(x.amount > 0)) return 'Bitte einen Betrag größer als 0 eingeben.';
        if (x.amount > it.balance + 0.005) return `Der Betrag liegt über der Restschuld (${fmtEUR(it.balance)}).`;
        it.balance = round2(Math.max(0, it.balance - x.amount));
        journalToday({ kind: 'prepay', title: `Sondertilgung: ${it.name}`, amount: -x.amount, ref: { type: 'installment', id: it.id, dBalance: round2(x.amount) }, balanceAdj: !!x.adjust });
        if (x.adjust) setBalance(App.state.settings.balance - x.amount);
        commit(); toast('Sondertilgung gebucht.' + startHint());
        if (it.balance <= 0.005) Fx.confetti();
      },
    });
  },
  async clearEntries() {
    const r = await askConfirm({ title: 'Alle Einträge löschen?', text: 'Daueraufträge, Buchungen, Rechnungen, Raten, Budgets, Oma-Vorgänge, die komplette Historie und der Kontostand werden entfernt. Dein Passwort und die Einstellungen bleiben.', ok: 'Einträge löschen', danger: true });
    if (!r.ok) return;
    Object.assign(App.state, { recurring: [], oneoffs: [], invoices: [], installments: [], journal: [], oma: [], budgets: [] });
    App.state.settings.balance = 0; App.state.settings.balanceDate = null; App.state.settings.trackStart = DEFAULT_SETTINGS.trackStart;
    commit(); toast('Einträge gelöscht');
  },
  export() { if (App.preview) return toast('Im Vorschau-Modus gibt es kein Backup.'); exportBackup(); },
  import() { if (App.preview) return toast('Im Vorschau-Modus gibt es keinen Import.'); chooseFile(importBackup); },
  importBackup() { if (App.preview) return toast('Im Vorschau-Modus gibt es keinen Import.'); chooseFile(importBackup); },
  changePw() { if (App.preview) return toast('Im Vorschau-Modus gibt es kein Passwort.'); changePasswordForm(); },
  wipe() { if (App.preview) return toast('Im Vorschau-Modus gibt es keinen Tresor.'); wipeForm(); },
  pvStart() { startPreview(); },
  pvReset() { if (App.preview) { App.plan = null; App.state = normalizeState(demoData()); render(); toast('Beispieldaten zurückgesetzt'); } },
};

/* ---------- Start ---------- */
function boot() {
  Modal.init();
  applyTheme();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = Actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]');
    if (el && Actions[el.dataset.change]) Actions[el.dataset.change](el.value, el);
  });
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => document.addEventListener(ev, () => {
    const now = Date.now();
    if (App.state && now - App.lastActivity > 1000) { App.lastActivity = now; armIdle(); }
  }, { passive: true }));
  Sync.install();
  Fx.install();
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (App.state && ($('[data-chart]') || $('[data-ribbon]'))) { const v = $('#view'); if (v) v.classList.remove('anim'); drawCharts(); } }, 150); });

  if (PREVIEW_BUILD) { startPreview(); return; }
  const cryptoOk = !!(window.crypto && crypto.subtle);
  if (!cryptoOk || !Store.ok()) {
    /* Eingebettete Ansicht (z. B. Vorschau im Chat): Speicher ist gesperrt, also direkt die Vorschau zeigen. */
    if (embedded()) { startPreview(); return; }
    if (!cryptoOk) fatalScreen('Verschlüsselung nicht verfügbar', 'Dieser Browser oder diese Verbindung unterstützt keine Web-Crypto-Funktionen. Öffne die Seite über https:// oder in einem aktuellen Browser.', true);
    else fatalScreen('Speicher nicht verfügbar', 'Der Browser blockiert das lokale Speichern (z. B. im privaten Modus). Öffne die Seite in einem normalen Browserfenster.', true);
    return;
  }
  render();
}

/* =====================================================================
   OMA (Bestellungen, Verkäufe, Eingänge) und HISTORIE (Buchungsjournal)
   ===================================================================== */
const trackStart = () => trackStartOf(App.state);
const isTracking = () => trackStarted(App.state, todayISO());
const startHint = () => (isTracking() ? '' : ` Die Historie startet am ${fmtDate(trackStart())}.`);
const fmtStamp = s => { try { return new Date(s).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' Uhr'; } catch (e) { return ''; } };

/* ---------- Journal: Buchungen werden angelegt und nur storniert, nie überschrieben ---------- */
function journalAdd(e) {
  const j = {
    id: uid(), date: e.date, area: e.area || 'own', kind: e.kind, title: e.title, amount: round2(e.amount),
    cash: e.cash !== false, ref: e.ref || null, note: e.note || '', balanceAdj: !!e.balanceAdj,
    cat: e.cat || '', provider: e.provider || '', budgetId: e.budgetId || '', createdAt: new Date().toISOString(), void: false,
  };
  App.state.journal.push(j);
  return j;
}
function journalToday(e) { return isTracking() ? journalAdd({ date: todayISO(), ...e }) : null; }

function voidLine(j, reason, reverseBalance) {
  j.void = true; j.voidAt = new Date().toISOString(); j.voidReason = reason;
  if (reverseBalance && j.cash) setBalance(App.state.settings.balance - j.amount);
  const r = j.ref;
  if (!r) return;
  if (r.type === 'invoice') {
    const inv = byId(App.state.invoices, r.id);
    if (inv) { inv.paid = false; inv.paidDate = ''; }
  } else if (r.type === 'installment') {
    const it = byId(App.state.installments, r.id);
    if (it) { it.balance = round2(it.balance + (r.dBalance || 0)); if (r.prevNextDue) it.nextDue = r.prevNextDue; }
  }
}

/* ---------- Oma: Texte und Hilfen ---------- */
const DELIVERY = {
  order: { ordered: 'Bestellt', shipped: 'Unterwegs', delivered: 'Geliefert' },
  sale: { ordered: 'Noch zu versenden', shipped: 'Versendet', delivered: 'Zugestellt' },
};
const BOOK_LABEL = { oma_order: 'Bezahlung buchen', oma_reimb: 'Erstattung buchen', oma_sale: 'Eingang buchen', oma_payout: 'Auszahlung buchen' };

function saldoInfo(saldo) {
  if (saldo > 0.005) return { cls: 'pos', text: `Oma schuldet dir ${fmtEUR(saldo)}` };
  if (saldo < -0.005) return { cls: 'owe', text: `Du schuldest Oma ${fmtEUR(-saldo)}` };
  return { cls: '', text: 'Zwischen dir und Oma ist alles ausgeglichen' };
}

function omaHomePanel() {
  const st = App.state;
  if (!st.oma.length && !st.journal.some(j => j.area === 'oma' && !j.void)) return '';
  const T = omaTotals(st.journal), info = saldoInfo(T.saldo);
  const pend = omaPending(st, todayISO());
  const late = pend.filter(p => p.overdue).length;
  return `<section class="panel"><div class="panel-h"><h2>Oma</h2><button class="link" data-act="nav" data-tab="oma">Öffnen</button></div>
    <p class="saldo ${info.cls}">${esc(info.text)}</p>
    <p class="muted">${pend.length ? `${pend.length} offene ${pend.length === 1 ? 'Schritt' : 'Schritte'}${late ? `, davon ${late} überfällig` : ''}.` : 'Keine offenen Schritte.'}</p></section>`;
}

/* ---------- Ansicht: Oma ---------- */
function omaCard(x, today) {
  const { it, legs } = x;
  const isOrder = it.kind === 'order';
  const delivery = DELIVERY[it.kind][it.delivery] || '';
  const legRows = legs.map((l, idx) => {
    const ready = idx === 0 || legs[0].complete;
    let status, cls = '';
    if (l.complete) {
      const d = l.lines.length ? l.lines[l.lines.length - 1].date : '';
      status = `gebucht${d ? ` am ${fmtDate(d)}` : ''}`; cls = 'done';
    } else {
      const late = validISO(l.date) && l.date < today;
      const part = l.done > 0 ? `Teilbetrag ${fmtEUR(l.done)} gebucht, Rest ${fmtEUR(l.remaining)}, ` : '';
      status = `${part}${validISO(l.date) ? `${l.dir > 0 ? 'erwartet' : 'geplant'} ${fmtDate(l.date)}${late ? ', überfällig' : ''}` : 'kein Termin'}${l.cash ? '' : ', nicht über dein Konto'}`;
      cls = late ? 'late' : '';
    }
    const btn = !l.complete && ready ? `<button class="btn sm primary" data-act="omaBook" data-id="${esc(it.id)}" data-leg="${l.key}">${esc(BOOK_LABEL[l.jkind])}</button>` : '';
    return `<li class="leg ${cls}"><i class="ld"></i><span><b>${esc(l.label)}</b> <span class="l-s">${esc(status)}</span></span>${btn}</li>`;
  }).join('');
  return `<li class="item oma">
    <div class="oma-h">
      <div class="item-t"><b>${esc(it.title)}</b>${it.party ? `<span class="tag">${esc(it.party)}</span>` : ''}<span class="tag ${isOrder ? '' : 'acc'}">${isOrder ? 'Bestellung' : 'Verkauf'}</span>${delivery ? `<span class="tag ${it.delivery === 'delivered' ? 'ok' : 'warnt'}">${esc(delivery)}</span>` : ''}</div>
      <div class="item-amt">${money(it.amount)}<small>${isOrder ? 'Bestellwert' : 'Erlös'}</small></div>
    </div>
    <div class="item-s">${isOrder ? 'Bestellt' : 'Verkauft'} am ${esc(fmtDate(it.date))}</div>
    <ol class="legs">${legRows}</ol>
    ${it.note ? `<div class="item-n">${esc(it.note)}</div>` : ''}
    <div class="item-btns start">${it.delivery !== 'delivered' ? `<button class="btn sm" data-act="omaDelivered" data-id="${esc(it.id)}">${isOrder ? 'Geliefert' : 'Zugestellt'}</button>` : ''}<button class="btn sm" data-act="editOma" data-id="${esc(it.id)}">Bearbeiten</button><button class="btn sm ghost" data-act="delOma" data-id="${esc(it.id)}">Löschen</button></div>
  </li>`;
}

function omaMonthRows(st) {
  const months = new Map();
  const m = key => { if (!months.has(key)) months.set(key, { key, ordered: 0, sold: 0, inflow: 0, outflow: 0, delta: 0 }); return months.get(key); };
  for (const it of st.oma) if (validISO(it.date)) { const r = m(it.date.slice(0, 7)); if (it.kind === 'order') r.ordered += it.amount; else r.sold += it.amount; }
  for (const j of st.journal) {
    if (j.void || j.area !== 'oma') continue;
    const r = m(j.date.slice(0, 7)), a = Math.abs(j.amount);
    if (j.kind === 'oma_sale' || j.kind === 'oma_reimb') { r.inflow += a; r.delta -= a; } else { r.outflow += a; r.delta += a; }
  }
  let run = 0;
  return [...months.values()].sort((a, b) => a.key.localeCompare(b.key)).map(r => { run = round2(run + r.delta); return { ...r, saldo: run }; });
}

function viewOma() {
  const st = App.state, today = todayISO(), J = st.journal;
  const T = omaTotals(J), info = saldoInfo(T.saldo);
  const filter = App.omaFilter || 'all';
  const all = st.oma.filter(i => filter === 'all' || i.kind === filter).map(it => ({ it, legs: omaLegs(it, J) }));
  const open = all.filter(x => !x.legs.every(l => l.complete))
    .sort((a, b) => ((a.legs.find(l => !l.complete).date) || '9999').localeCompare((b.legs.find(l => !l.complete).date) || '9999'));
  const done = all.filter(x => x.legs.every(l => l.complete)).sort((a, b) => b.it.date.localeCompare(a.it.date));
  const pending = omaPending(st, today);
  const expected = pending.filter(p => p.leg.dir > 0 && validISO(p.leg.date)).slice(0, 8);
  const received = J.filter(j => !j.void && j.area === 'oma' && j.amount > 0).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt)).slice(0, 5);
  const transit = st.oma.filter(i => i.delivery === 'shipped').length;
  const months = omaMonthRows(st);

  const banner = isTracking() ? '' : `<div class="banner"><div><b>Die Erfassung startet am ${esc(fmtDate(trackStart()))}.</b> Vorgänge dürfen schon jetzt mit späterem Datum angelegt werden. Zahlungen buchen kannst du ab dem Start. Den Stichtag änderst du unter „Einstellungen“.</div></div>`;

  const statement = `<dl class="kv">
    <div><dt>Für Oma bezahlt (Bestellungen)</dt><dd>${money(T.order)}</dd></div>
    <div><dt>An Oma ausgezahlt</dt><dd>${money(T.payout)}</dd></div>
    <div><dt>Von Oma erstattet</dt><dd>${money(-T.reimb)}</dd></div>
    <div><dt>Verkaufserlöse für Oma erhalten</dt><dd>${money(-T.sale)}</dd></div>
    <div class="sum"><dt>Saldo</dt><dd class="${info.cls}">${money(T.saldo)}</dd></div></dl>`;

  const expectedRows = expected.length ? `<ul class="evs">${expected.map(p => `<li class="ev"><span class="ev-d">${esc(fmtWd(p.leg.date))}</span><span class="ev-n"><b>${esc(p.item.title)}</b> <span class="tag">${esc(p.leg.label)}</span>${p.overdue ? '<span class="stamp">Überfällig</span>' : ''}</span><span class="ev-a pos">${money(p.leg.remaining)}</span></li>`).join('')}</ul>` : '<p class="empty">Keine Eingänge erwartet.</p>';
  const receivedRows = received.length ? `<ul class="evs">${received.map(j => `<li class="ev"><span class="ev-d">${esc(fmtWd(j.date))}</span><span class="ev-n"><b>${esc(j.title)}</b> <span class="tag">${esc(JOURNAL_KINDS[j.kind])}</span></span><span class="ev-a pos">${money(j.amount)}</span></li>`).join('')}</ul>` : '<p class="empty">Noch nichts eingegangen.</p>';

/* ---------- Ansicht: Historie ---------- */
function monthKeys(st, today) {
  const keys = new Set();
  const start = trackStartOf(st);
  if (today >= start) {
    let y = parseISO(start).y, m = parseISO(start).m;
    const end = parseISO(today);
    while (y < end.y || (y === end.y && m <= end.m)) { keys.add(`${y}-${pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
  }
  for (const j of st.journal) keys.add(j.date.slice(0, 7));
  return [...keys].sort().reverse();
}

function journalRow(j) {
  return `<li class="jr ${j.void ? 'void' : ''}">
    <div class="jr-m"><b class="jr-t">${esc(j.title)}</b> <span class="tag">${esc(JOURNAL_KINDS[j.kind] || j.kind)}</span>${(j.kind === 'expense' || j.kind === 'income') && j.cat ? `<span class="tag">${esc(j.cat)}</span>` : ''}${j.provider ? `<span class="tag plat">${esc(j.provider)}</span>` : ''}${j.area === 'oma' ? '<span class="tag acc">Oma</span>' : ''}${j.cash ? '' : '<span class="tag">nicht über Konto</span>'}${j.void ? '<span class="stamp">Storno</span>' : ''}
      ${j.note ? `<div class="jr-meta">${esc(j.note)}</div>` : ''}
      <div class="jr-meta">Erfasst ${esc(fmtStamp(j.createdAt))}${j.void ? `. Storniert ${esc(fmtStamp(j.voidAt))}: ${esc(j.voidReason || 'ohne Begründung')}` : ''}</div></div>
    <span class="jr-a ${j.amount > 0 ? 'pos' : ''}">${money(j.amount)}</span>
    <div class="jr-b">${j.void ? '' : `<button class="btn sm ghost" data-act="jNote" data-id="${esc(j.id)}">Notiz</button><button class="btn sm" data-act="jVoid" data-id="${esc(j.id)}">Stornieren</button>`}</div></li>`;
}

function groupJournal(lines) {
  const days = new Map();
  for (const j of lines) { if (!days.has(j.date)) days.set(j.date, []); days.get(j.date).push(j); }
  return [...days.entries()].map(([date, js]) => {
    const net = js.filter(j => !j.void && j.cash).reduce((a, j) => a + j.amount, 0);
    return `<div class="jday"><div class="jday-h"><b>${esc(fmtWd(date))}</b><span>${esc(fmtEUR(net))}</span></div><ul class="jrs">${js.map(journalRow).join('')}</ul></div>`;
  }).join('');
}

function viewJournal() {
  const st = App.state, today = todayISO(), start = trackStart();
  const head = `<header class="page-head"><div><h1>Historie</h1><p class="sub">Alle tatsächlichen Buchungen ab dem ${esc(fmtDate(start))}. Gebuchtes wird nie überschrieben, nur storniert. So bleibt jeder Stand nachvollziehbar.</p></div>
    <div class="actions"><button class="btn primary" data-act="addBooking">Buchung erfassen</button></div></header>`;
  if (!isTracking()) {
    const days = dayNum(start) - dayNum(today);
    return head + `<section class="panel"><div class="banner flat"><div><b>Die Historie startet am ${esc(fmtDate(start))}</b> (${days === 1 ? 'morgen' : `in ${days} Tagen`}). Bis dahin planst du nur: Kontostand, Daueraufträge, Rechnungen, Raten und Oma-Vorgänge kannst du schon jetzt eintragen.</div></div>
      <p class="muted">Ab dem Start entsteht bei jeder Zahlung automatisch eine Buchung: wenn du eine Rechnung oder Rate als bezahlt markierst, eine Sondertilgung buchst, den Kontostand abgleichst oder bei Oma einen Zahlungsschritt buchst. Eigene Einnahmen und Ausgaben trägst du über „Buchung erfassen“ ein.</p>
      <p class="muted">Den Stichtag änderst du unter „Einstellungen“.</p></section>`;
  }
  const keys = monthKeys(st, today);
  const sel = keys.includes(App.jMonth) ? App.jMonth : today.slice(0, 7);
  const area = App.jArea || 'all';
  const inMonth = st.journal.filter(j => j.date.slice(0, 7) === sel);
  const lines = inMonth.filter(j => area === 'all' || j.area === area)
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  const live = inMonth.filter(j => !j.void);
  const sum = (f) => live.filter(f).reduce((a, j) => a + j.amount, 0);
  const own = j => j.area === 'own' && j.cash, oma = j => j.area === 'oma' && j.cash;
  const voids = inMonth.filter(j => j.void).length;
  const summary = `<dl class="kv">
    <div><dt>Eigene Eingänge</dt><dd class="pos">${money(sum(j => own(j) && j.amount > 0))}</dd></div>
    <div><dt>Eigene Ausgänge</dt><dd>${money(sum(j => own(j) && j.amount < 0))}</dd></div>
    <div><dt>Oma: Eingänge</dt><dd class="pos">${money(sum(j => oma(j) && j.amount > 0))}</dd></div>
    <div><dt>Oma: Ausgänge</dt><dd>${money(sum(j => oma(j) && j.amount < 0))}</dd></div>
    <div class="sum"><dt>Veränderung Konto</dt><dd>${money(sum(j => j.cash))}</dd></div></dl>`;
  return head + `<section class="panel">
    <div class="ctl"><label class="inl"><span>Monat</span><select data-change="jMonth">${keys.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(new Date(+k.slice(0, 4), +k.slice(5) - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }))}</option>`).join('')}</select></label>
      <div class="seg">${[['all', 'Alle'], ['own', 'Eigene'], ['oma', 'Oma']].map(([v, l]) => `<button class="chip-btn ${area === v ? 'on' : ''}" data-act="jArea" data-v="${v}">${l}</button>`).join('')}</div></div>
    ${summary}
    <p class="fine muted tbl-note">${live.length} ${live.length === 1 ? 'Buchung' : 'Buchungen'} in diesem Monat${voids ? `, ${voids} storniert` : ''}.</p>
  </section>
  <section class="panel"><div class="panel-h"><h2>Buchungen</h2></div>${lines.length ? groupJournal(lines) : '<p class="empty">In diesem Monat gibt es keine Buchungen.</p>'}</section>`;
}

/* ---------- Formulare: Oma-Vorgang ---------- */
function omaForm(kind, item) {
  const isOrder = kind === 'order';
  const today = todayISO(), ts = trackStart();
  const startDate = today < ts ? ts : today;
  const base = isOrder
    ? { title: '', party: '', amount: '', date: startDate, pay: 'account', payDate: startDate, expectBack: '', delivery: 'ordered', note: '' }
    : { title: '', party: '', amount: '', date: startDate, via: 'account', expectIn: fromDayNum(dayNum(startDate) + 3), payoutDate: '', delivery: 'ordered', note: '' };
  const v = item || base;
  const locked = !!item && omaLegs(item, App.state.journal).some(l => l.lines.length);
  const lockHint = locked ? 'Gesperrt, weil schon gebucht. Storniere die Buchung in der Historie, um den Betrag zu ändern.' : '';
  const deliveryOpts = Object.entries(DELIVERY[kind]);
  const fields = isOrder ? [
    { key: 'title', label: 'Was wurde bestellt?', type: 'text', required: true, placeholder: 'z. B. Orthopädische Schuhe' },
    { key: 'party', label: 'Shop', type: 'text', half: true, list: ['Amazon', 'Otto', 'Zalando', 'Apotheke', 'eBay', 'Sonstige'] },
    { key: 'amount', label: 'Betrag', type: 'money', half: true, required: true, disabled: locked, hint: lockHint },
    { key: 'date', label: 'Bestelldatum', type: 'date', half: true, required: true, min: ts },
    { key: 'delivery', label: 'Lieferstatus', type: 'select', half: true, options: deliveryOpts },
    { key: 'pay', label: 'Bezahlt über', type: 'select', options: [['account', 'Mein Girokonto oder meine Karte'], ['invoice', 'Kauf auf Rechnung (PayPal, Klarna): Zahlung zur Fälligkeit'], ['other', 'Anders bezahlt (PayPal-Guthaben, bar)']] },
    { key: 'payDate', label: 'Abbuchung oder Fälligkeit am', type: 'date', half: true, required: true, min: ts },
    { key: 'expectBack', label: 'Erstattung von Oma erwartet am', type: 'date', half: true, hint: 'Optional.' },
    { key: 'note', label: 'Notiz (optional)', type: 'text' },
  ] : [
    { key: 'title', label: 'Was wurde verkauft?', type: 'text', required: true, placeholder: 'z. B. Porzellan-Service' },
    { key: 'party', label: 'Plattform oder Käufer', type: 'text', half: true, list: ['eBay Kleinanzeigen', 'eBay', 'Vinted', 'Facebook Marktplatz', 'Flohmarkt'] },
    { key: 'amount', label: 'Erlös nach Gebühren', type: 'money', half: true, required: true, disabled: locked, hint: lockHint },
    { key: 'date', label: 'Verkaufsdatum', type: 'date', half: true, required: true, min: ts },
    { key: 'delivery', label: 'Versandstatus', type: 'select', half: true, options: deliveryOpts },
    { key: 'via', label: 'Zahlung kommt an auf', type: 'select', options: [['account', 'Meinem Girokonto'], ['other', 'Anderswo (PayPal-Guthaben, bar)']] },
    { key: 'expectIn', label: 'Zahlungseingang erwartet am', type: 'date', half: true, required: true },
    { key: 'payoutDate', label: 'Auszahlung an Oma geplant am', type: 'date', half: true, hint: 'Optional.' },
    { key: 'note', label: 'Notiz (optional)', type: 'text' },
  ];
  openForm({
    title: item ? (isOrder ? 'Bestellung bearbeiten' : 'Verkauf bearbeiten') : (isOrder ? 'Bestellung für Oma' : 'Verkauf für Oma'),
    intro: isOrder ? '<p>Du bestellst für Oma und gehst in Vorleistung. Die App verfolgt Bezahlung, Lieferung und Erstattung.</p>' : '<p>Du verkaufst für Oma. Der Erlös kommt bei dir an und gehört Oma. Die App merkt ihn dir vor und rührt ihn nie für Sondertilgungen an.</p>',
    values: v, fields,
    onInput: (api, key) => {
      if (isOrder && (key === 'date' || key === 'pay') && api.get('pay') === 'account') api.set('payDate', api.get('date'));
    },
    onSubmit: x => {
      if (!x.title) return 'Bitte eine Beschreibung eingeben.';
      if (!(x.amount > 0)) return 'Bitte einen Betrag größer als 0 eingeben.';
      if (!validISO(x.date)) return 'Bitte das Datum wählen.';
      if (x.date < ts) return `Vorgänge werden ab dem ${fmtDate(ts)} erfasst (Erfassungsstart). Den Stichtag änderst du unter „Einstellungen“.`;
      const it = { id: item ? item.id : uid(), kind, title: x.title, party: x.party, amount: round2(x.amount), date: x.date, delivery: x.delivery, note: x.note, bk: item ? item.bk || [] : [], createdAt: item ? item.createdAt : new Date().toISOString() };
      if (isOrder) {
        if (!validISO(x.payDate)) return 'Bitte das Zahlungsdatum wählen.';
        Object.assign(it, { pay: x.pay, payDate: x.payDate, expectBack: validISO(x.expectBack) ? x.expectBack : '' });
      } else {
        if (!validISO(x.expectIn)) return 'Bitte das erwartete Eingangsdatum wählen.';
        Object.assign(it, { via: x.via, expectIn: x.expectIn, payoutDate: validISO(x.payoutDate) ? x.payoutDate : '' });
      }
      upsert(App.state.oma, it);
      commit(); toast('Gespeichert');
    },
  });
}

function omaBookForm(itemId, legKey) {
  const it = byId(App.state.oma, itemId); if (!it) return;
  if (!isTracking()) { toast(`Buchungen sind ab dem ${fmtDate(trackStart())} möglich (Erfassungsstart).`, 'bad'); return; }
  const leg = omaLegs(it, App.state.journal).find(l => l.key === legKey); if (!leg) return;
  const today = todayISO();
  openForm({
    title: `${leg.label}: ${it.title}`, submit: 'Buchen',
    intro: `<p>Offen: <b>${esc(fmtEUR(leg.remaining))}</b>. Die Buchung erscheint in der Historie und lässt sich dort bei Bedarf stornieren.</p>`,
    values: { date: today, amount: leg.remaining, cash: leg.cash, adjust: leg.cash },
    fields: [
      { key: 'date', label: 'Datum der Zahlung', type: 'date', half: true, required: true, min: trackStart(), max: today },
      { key: 'amount', label: 'Betrag', type: 'money', half: true, required: true, hint: 'Weniger als offen ist möglich (Teilzahlung).' },
      { key: 'cash', label: 'Die Zahlung läuft über dein Girokonto', type: 'checkbox' },
      { key: 'adjust', label: 'Kontostand entsprechend anpassen', type: 'checkbox', hint: 'Hast du den Kontostand schon aus deiner Banking-App aktualisiert, lass das Häkchen weg.' },
    ],
    onInput: (api, key) => { if (key === 'cash' && !api.get('cash')) api.set('adjust', false); },
    onSubmit: x => {
      if (!validISO(x.date) || x.date < trackStart()) return `Das Datum muss ab dem ${fmtDate(trackStart())} liegen.`;
      if (x.date > today) return 'Das Datum liegt in der Zukunft. Gebucht wird nur, was schon passiert ist.';
      if (!(x.amount > 0)) return 'Bitte einen Betrag größer als 0 eingeben.';
      if (x.amount > leg.remaining + 0.005) return `Der Betrag liegt über dem offenen Rest (${fmtEUR(leg.remaining)}).`;
      const line = journalAdd({ date: x.date, area: 'oma', kind: leg.jkind, title: `${it.title}${it.party ? ` (${it.party})` : ''}`, amount: leg.dir * x.amount, cash: x.cash, ref: { type: 'oma', id: it.id, leg: leg.key }, balanceAdj: x.cash && x.adjust });
      (it.bk || (it.bk = [])).push({ leg: leg.key, jid: line.id });
      if (x.cash && x.adjust) setBalance(App.state.settings.balance + line.amount);
      commit(); toast('Gebucht');
    },
  });
}

    ],

    },

    if ((await askConfirm({ title: `„${it.title}“ löschen?`, ok: 'Löschen', danger: true })).ok) { App.state.oma = App.state.oma.filter(i => i.id !== d.id); commit(); toast('Gelöscht'); }
  },
  addBooking() { bookingForm(); },
  addExpense(d) { bookingForm({ cat: d && d.cat }); },

/* =====================================================================
   BUDGETS – flexible Ausgaben (Einkauf, Shopping, Freizeit, …)
   Monatsbudget pro Kategorie. Du erfasst nur, was du ausgibst. Die Prognose
   rechnet im laufenden Monat mit dem Rest und danach mit dem vollen Budget.
   ===================================================================== */
const monthLabel = key => new Date(+key.slice(0, 4), +key.slice(5) - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

function budgetRows(st, mk) {
  return st.budgets.map(b => {
    const amt = budgetAmount(b, mk), spent = budgetSpent(st, b, mk);
    return { b, amt, spent, left: round2(amt - spent) };
  });
}
const barClass = (spent, amt) => { const r = amt > 0 ? spent / amt : 0; return r > 1 ? 'over' : r >= 0.8 ? 'warn' : ''; };
const barPct = (spent, amt) => Math.min(100, amt > 0 ? (spent / amt) * 100 : 0).toFixed(1);
const daysLeftInMonth = today => { const { y, m, d } = parseISO(today); return dim(y, m) - d + 1; };

function expensesThisMonthWithoutBudget(st, mk) {
  return round2(st.journal.filter(j => !j.void && j.area === 'own' && j.kind === 'expense' && j.date.slice(0, 7) === mk && !st.budgets.some(b => budgetMatches(j, b)))
    .reduce((a, j) => a - j.amount, 0));
}

    <div class="row-actions"><button class="btn sm primary" data-act="addExpense">Ausgabe erfassen</button></div></section>`;

/* ---------- Ansicht: Budgets ---------- */
function budgetCard(r, daysLeft, idx) {
  const { b, amt, spent, left } = r;
  const over = left < -0.005, tracking = isTracking();
  const note = !tracking
    ? `Budget ${fmtEUR(amt)} pro Monat. Bis zum Erfassungsstart rechnet die Prognose mit dem anteiligen Betrag.`
    : `Ausgegeben ${fmtEUR(spent)} von ${fmtEUR(amt)} in diesem Monat${over ? `, Budget um ${fmtEUR(-left)} überzogen.` : '.'}`;
  return `<li class="item bud" style="--bc:var(--c${(idx % 6) + 1})">
    <div class="oma-h"><div class="item-t"><span class="bud-dot"></span><b>${esc(b.name)}</b><span class="tag">${esc(fmtEUR(amt))} pro Monat</span></div>
      <div class="item-amt ${over ? 'neg' : ''}">${money(left)}<small>${over ? 'überzogen' : 'noch übrig'}</small></div></div>
    <div class="bar ${barClass(spent, amt)}"><i style="width:${barPct(spent, amt)}%"></i></div>

}

    return `<tr><th>${esc(fmtMonthKey(m))}${m === mk ? '<span class="tag">läuft</span>' : ''}</th><td>${money(bt)}</td><td>${money(sp)}</td><td>${nb > 0.005 ? money(nb) : '–'}</td><td class="${diff < 0 ? 'neg' : 'pos'}">${money(diff)}</td></tr>`;
  }).join('')}</tbody></table></div><p class="fine muted tbl-note">Verglichen wird mit dem Budget, das in dem jeweiligen Monat galt. Positive Differenz: Geld gespart (im laufenden Monat: noch übrig), negative: überzogen. Weitere Ausgaben sind Buchungen ohne Budget-Kategorie, zum Beispiel Fixkosten.</p></section>` : '';

    <div class="stack">${summary}<section class="panel"><div class="panel-h"><h2>Letzte Ausgaben</h2><button class="link" data-act="nav" data-tab="journal">Historie</button></div>${recentHTML}</section></div>
  </div>${hist}${fabHTML()}`;
}

function budgetForm(item) {
  openForm({

    values: item || { name: '', amount: '' },

      { key: 'name', label: 'Kategorie', type: 'text', half: true, required: true, placeholder: 'z. B. Lebensmittel', list: ['Lebensmittel', 'Shopping', 'Freizeit', 'Mobilität', 'Kleidung', 'Gesundheit', 'Sonstiges'] },

/* =====================================================================
   EFFEKTE – sparsam und mit Bedeutung
   Zählwerk beim Öffnen, Frist-Leiste, Lichtkegel im Kopfbereich, Konfetti.
   Alles ist bei „Bewegung reduzieren“ ausgeschaltet.
   ===================================================================== */
const Fx = {
  raf: 0,
  ok() {
    try { return typeof requestAnimationFrame === 'function' && typeof matchMedia === 'function' && !matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  },
  install() {
    document.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch' || this.raf || !this.ok()) return;
      const h = e.target.closest ? e.target.closest('.hero') : null;
      if (!h) return;
      this.raf = requestAnimationFrame(() => {
        const r = h.getBoundingClientRect();
        h.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        h.style.setProperty('--my', (e.clientY - r.top) + 'px');
        this.raf = 0;
      });
    }, { passive: true });
  },
  /* nach jedem Aufbau der Seite; animate = nur beim Seitenwechsel */
  after(animate) {
    if (!animate) return;
    /* Nach der Eingangssequenz wird die Animationsklasse entfernt, damit Größenwechsel oder Neuaufbau nichts erneut abspielen */
    clearTimeout(this.animT);
    this.animT = setTimeout(() => { const v = $('#view'); if (v) v.classList.remove('anim'); }, 3000);
    if (!this.ok()) return;
    const n = $('.hero-num');
    if (n && n.dataset.v !== undefined) this.countUp(n, parseFloat(n.dataset.v), 850);
  },
  countUp(el, to, ms) {
    if (!Number.isFinite(to)) return;
    const t0 = performance.now(), ease = x => 1 - Math.pow(1 - x, 3);
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      el.textContent = fmtEUR(to * ease(k));
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmtEUR(to);
    };
    requestAnimationFrame(step);
  },
  confetti() {
    if (!this.ok()) return;
    let host = document.getElementById('fx');
    if (!host) { host = document.createElement('div'); host.id = 'fx'; host.setAttribute('aria-hidden', 'true'); document.body.appendChild(host); }
    const cols = ['#f4dc3e', '#4cc3cb', '#d9573a', '#2f8f5b', '#4b5fd6', '#8a58c9'];
    for (let i = 0; i < 46; i++) {
      const c = document.createElement('i');
      c.className = 'cf';
      const ang = (-0.15 - Math.random() * 0.7) * Math.PI, dist = 180 + Math.random() * 360;
      c.style.left = (42 + Math.random() * 16) + '%';
      c.style.background = cols[i % cols.length];
      c.style.setProperty('--dx', Math.round(Math.cos(ang) * dist * (Math.random() < .5 ? -1 : 1)) + 'px');
      c.style.setProperty('--dy', Math.round(Math.abs(Math.sin(ang)) * -dist * 0.55 + 240 + Math.random() * 220) + 'px');
      c.style.setProperty('--rot', Math.round(Math.random() * 900 - 450) + 'deg');
      c.style.setProperty('--dl', (Math.random() * 0.12).toFixed(2) + 's');
      host.appendChild(c);
    }
    setTimeout(() => { host.textContent = ''; }, 2200);
  },
};

/* Frist-Leiste: Zahlungen und Fristen der nächsten 30 Tage auf einer Zeitachse.
   Rechnungen erscheinen als gelber Textmarker an dem Tag, an dem überwiesen wird. */
function drawRibbon(host, P) {
  const LANE = 31, win = rangeWindow(P), r0 = win.r0, r1 = win.r1, DAYS = Math.max(1, r1 - r0);
  const W = Math.max(260, Math.floor(host.clientWidth || (host.parentElement && host.parentElement.clientWidth) || 640));
  const list = P.opt.log.filter(e => e.i >= r0 && e.i <= r1 && ['invoice', 'rate', 'prepay', 'income'].includes(e.type)).sort((a, b) => a.t - b.t || TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
  const title = win.mode === 'cur' ? 'Fristen und Zahlungen bis Monatsende'
    : win.mode === 'next' ? `Fristen und Zahlungen im ${new Date(+win.key.slice(0, 4), +win.key.slice(5) - 1, 1).toLocaleDateString('de-DE', { month: 'long' })}`
      : 'Fristen und Zahlungen der nächsten 30 Tage';
  const head = `<div class="rb-t"><b>${esc(title)}</b><span>${list.length} ${list.length === 1 ? 'Termin' : 'Termine'}</span></div>`;
  if (!list.length) { host.innerHTML = head + '<p class="rb-empty">Es stehen keine Rechnungen, Raten oder Einnahmen an.</p>'; return; }

  const short = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  const lanes = [];
  let k = 0, chips = '';
  for (const e of list) {
    const label = e.type === 'income' ? `${short(e.name, 14)} +${fmtCompact(e.amount)}` : `${short(e.name, 14)} ${fmtCompact(-e.amount)}`;
    const w = 22 + label.length * 6.7;
    const px = Math.round(((e.i - r0) / DAYS) * (W - 10));
    let left = Math.max(0, Math.min(px, W - w)), dot = false, lane = lanes.findIndex(r => r + 6 <= left);
    if (lane < 0 && lanes.length < 3) { lane = lanes.length; lanes.push(-99); }
    if (lane < 0) {                                      // kein Platz für den Text: nur ein Punkt
      dot = true; left = Math.max(0, Math.min(px, W - 12));
      lane = lanes.findIndex(r => r + 4 <= left);
      if (lane < 0) continue;
    }
    lanes[lane] = left + (dot ? 12 : w);
    const cls = e.type === 'invoice' ? 'inv' : e.type === 'prepay' ? 'pre' : e.type === 'income' ? 'inc' : '';
    const title = `${e.name}, ${fmtWd(P.dateAt(e.i))}, ${fmtEUR(e.amount)}${e.type === 'invoice' && e.due ? `, Frist ${fmtShort(fromDayNum(e.due))}` : ''}`;
    chips += `<span class="rb-chip ${cls}${dot ? ' dot' : ''}" style="left:${left}px;bottom:${28 + lane * LANE}px;--k:${e.type === 'invoice' ? k++ : 0}" title="${esc(title)}">${dot ? '' : esc(label)}</span>`;
  }
  let ticks = '';
  for (let d = 0; d <= DAYS - 1; d += 7) {
    const px = Math.round((d / DAYS) * (W - 10));
    ticks += `<span class="rb-tick" style="left:${px}px"></span><span class="rb-lbl${d === 0 ? ' first' : ''}" style="left:${px}px">${d === 0 && r0 === 0 ? 'heute' : esc(fmtShort(P.dateAt(r0 + d)))}</span>`;
  }
  host.innerHTML = head + `<div class="rb-track" style="height:${lanes.length * LANE + 34}px"><div class="rb-axis"></div>${ticks}${chips}</div>`;
}

/* =====================================================================
   SYNCHRONISATION (Handy, Laptop) über ein privates GitHub-Repository
   Im Repository liegt nur der bereits verschlüsselte Tresor. Passwort und
   Token verlassen das Gerät nie. Zugriff über die GitHub-Contents-API.
   ===================================================================== */
const GH_API = 'https://api.github.com';
const SYNC_FILE = 'kassensturz-tresor.json';

class SyncError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }

const ghUrl = (cfg, sub) => `${GH_API}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}${sub || ''}`;
const ghContentsUrl = cfg => ghUrl(cfg, '/contents/' + cfg.path.split('/').map(encodeURIComponent).join('/'));
const ghHeaders = (token, accept) => ({ Authorization: `Bearer ${token}`, Accept: accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });

async function ghFetch(url, opts) {
  try { return await fetch(url, opts); } catch (e) { throw new SyncError('offline', 'Keine Verbindung zu GitHub.'); }
}
async function ghCheck(res) {
  if (res.ok) return;
  if (res.status === 401) throw new SyncError('auth', 'Der Token ist ungültig oder abgelaufen. Erstelle einen neuen und trage ihn unter „Token erneuern“ ein.');
  if (res.status === 403) {
    const left = res.headers && res.headers.get ? res.headers.get('x-ratelimit-remaining') : null;
    if (left === '0') throw new SyncError('rate', 'GitHub-Limit erreicht. Versuche es in einigen Minuten erneut.');
    throw new SyncError('auth', 'Der Token hat keine Berechtigung. Er braucht „Contents: Read and write“ für dieses Repository.');
  }
  if (res.status === 404) throw new SyncError('notfound', 'Repository nicht gefunden, oder der Token hat keinen Zugriff darauf.');
  throw new SyncError('other', `GitHub antwortet mit Fehler ${res.status}.`);
}
async function ghRepoInfo(cfg) {
  const res = await ghFetch(ghUrl(cfg), { headers: ghHeaders(cfg.token), cache: 'no-store' });
  await ghCheck(res);
  return res.json();
}
/* Gibt {sha, text} zurück oder null, wenn die Datei noch nicht existiert */
async function ghGetFile(cfg) {
  const url = ghContentsUrl(cfg);
  const res = await ghFetch(url, { headers: ghHeaders(cfg.token), cache: 'no-store' });
  if (res.status === 404) return null;
  await ghCheck(res);
  const j = await res.json();
  if (j.content && j.encoding === 'base64') return { sha: j.sha, text: atob(j.content.replace(/\s/g, '')) };
  const r2 = await ghFetch(url, { headers: ghHeaders(cfg.token, 'application/vnd.github.raw+json'), cache: 'no-store' });   // Dateien über 1 MB
  await ghCheck(r2);
  return { sha: j.sha, text: await r2.text() };
}
async function ghPutFile(cfg, text, sha, message) {
  const body = { message, content: btoa(text) };
  if (sha) body.sha = sha;
  const res = await ghFetch(ghContentsUrl(cfg), { method: 'PUT', headers: { ...ghHeaders(cfg.token), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422) throw new SyncError('conflict', 'Gleichzeitige Änderung auf einem anderen Gerät.');
  await ghCheck(res);
  const j = await res.json();
  return j.content.sha;
}

const remoteRev = text => { try { return (JSON.parse(text).meta || {}).rev || 0; } catch (e) { return 0; } };
const syncErrorText = e => (e instanceof SyncError ? e.message : `Unerwarteter Fehler: ${e && e.message ? e.message : e}`);

/* ---------- Ablaufsteuerung ---------- */
const Sync = {
  busy: false, again: false, timer: null, poll: null, status: 'off', message: '', last: null, reason: '', checkedAt: 0, installed: false, epoch: 0, conflicts: 0,
  cfg() { return App.state && !App.preview ? App.state.sync : null; },
  enabled() { return !!this.cfg(); },
  dirty() { const c = this.cfg(); return !c || !c.base || !sameState(c.base, stripSync(App.state)); },
  setStatus(s, msg) { this.status = s; this.message = msg || ''; refreshSyncUI(); },

  install() {
    if (this.installed) return;
    this.installed = true;
    document.addEventListener('visibilitychange', () => {
      if (!this.enabled()) return;
      if (document.hidden) { if (this.dirty()) this.run('hide'); } else if (Date.now() - this.checkedAt > 20000) this.run('focus');
    });
    window.addEventListener('online', () => { if (this.enabled()) this.run('online'); });
    window.addEventListener('offline', () => { if (this.enabled()) this.setStatus('offline', 'Offline. Änderungen werden hochgeladen, sobald du wieder online bist.'); });
  },
  start() {
    this.epoch++; clearTimeout(this.timer); clearInterval(this.poll); this.poll = null;
    if (!this.enabled()) { this.setStatus('off'); return; }
    this.poll = setInterval(() => { if (!document.hidden && this.enabled() && !this.busy) this.run('poll'); }, 120000);
    this.checkedAt = 0;
    this.run('unlock');
  },
  stop() { this.epoch++; clearTimeout(this.timer); clearInterval(this.poll); this.poll = null; this.setStatus('off'); },
  schedule(ms) {
    if (!this.enabled()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run('auto'), ms == null ? 1500 : ms);
  },

  /* true bei Erfolg, false bei Fehler */
  async run(reason) {
    if (!this.enabled()) return false;
    if (this.busy) { this.again = true; return false; }
    this.busy = true; this.reason = reason; this.conflicts = 0;
    const epoch = this.epoch;
    this.setStatus('syncing');
    let okay = false;
    try {
      const r = await this.cycle(epoch);
      this.last = new Date(); this.checkedAt = Date.now(); okay = true;
      this.setStatus('ok');
      if (reason === 'manual') {
        toast(r === 'uptodate' ? 'Alles auf dem neuesten Stand.' : r === 'pulled' ? 'Änderungen vom anderen Gerät übernommen.'
          : r === 'merged' ? `Änderungen zusammengeführt${this.conflicts ? ` (${this.conflicts} Widerspruch: deine Änderung gilt)` : ''}.` : 'Synchronisiert.');
      } else if (r === 'pulled' || r === 'merged') toast('Änderungen vom anderen Gerät übernommen');
    } catch (e) {
      if (e.kind !== 'stopped') this.handleError(e, reason);
    } finally {
      this.busy = false;
      if (this.again && this.enabled()) { this.again = false; this.schedule(400); }
    }
    return okay;
  },
  handleError(e, reason) {
    const msg = syncErrorText(e);
    if (e.kind === 'offline') this.setStatus('offline', 'Offline. Änderungen werden hochgeladen, sobald du wieder online bist.');
    else if (e.kind === 'password') this.setStatus('password', msg);
    else { this.setStatus('error', msg); if (e.kind === 'conflict') this.schedule(5000); }
    if (reason === 'manual' && e.kind !== 'offline') toast(msg, 'bad');
  },

  async seal(state, rev) {
    const rec = await sealRecord(state, App.key, App.salt, App.iter);
    rec.meta = { rev, at: new Date().toISOString() };
    return JSON.stringify(rec);
  },
  /* Entschlüsselt den Stand aus dem Repository. Bei geändertem Passwort wird das neue Passwort erfragt. */
  async openRemote(rec) {
    checkRecord(rec);
    if (rec.salt === b64(App.salt) && rec.iter === App.iter) return this.decryptSameKey(rec);
    if (this.reason !== 'manual' && Modal.el.hasAttribute('open')) throw new SyncError('password', 'Das Passwort wurde auf einem anderen Gerät geändert. Tippe unter „Einstellungen“ auf „Jetzt synchronisieren“ und gib das neue Passwort ein.');
    const r = await askRemotePassword(rec, '<p>Das Passwort wurde auf einem anderen Gerät geändert. Gib das <b>neue</b> Passwort ein, um weiter zu synchronisieren.</p>');
    if (!r) throw new SyncError('password', 'Das Passwort wurde auf einem anderen Gerät geändert. Gib das neue Passwort ein, um weiter zu synchronisieren.');
    App.key = r.key; App.salt = r.salt; App.iter = r.iter;
    return r.state;
  },
  async decryptSameKey(rec) {
    try {
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv), additionalData: AAD }, App.key, unb64(rec.ct));
      return normalizeState(JSON.parse(dec.decode(plain)));
    } catch (e) { throw new SyncError('decrypt', 'Der Tresor im Repository lässt sich nicht entschlüsseln. Die Datei ist beschädigt oder stammt aus einem anderen Tresor.'); }
  },
  applyMerged(merged) {
    const sync = App.state.sync;
    Object.assign(App.state, merged);
    App.state.sync = sync;
    App.plan = null; persist(); render();
  },
  markSynced(sha, snap, rev) {
    const c = App.state.sync;
    c.prev = [c.sha, ...(c.prev || [])].filter(Boolean).slice(0, 6);
    c.sha = sha; c.base = cloneJSON(snap); c.rev = rev; c.last = new Date().toISOString();
    persist();
  },

  /* Ein Abgleich: holen, zusammenführen, hochladen. Wiederholt sich bei gleichzeitigen Änderungen. */
  async cycle(epoch) {
    const alive = () => { if (epoch !== this.epoch || !App.state || !App.state.sync) throw new SyncError('stopped', ''); };
    for (let attempt = 0; attempt < 4; attempt++) {
      const cfg = App.state.sync;
      const remote = await ghGetFile(cfg); alive();

      if (!remote || cfg.pwChanged) {                       // Datei fehlt oder Passwort wurde hier geändert: lokalen Stand hochladen
        const snap = stripSync(App.state), rev = remote ? remoteRev(remote.text) : 0;
        try {
          const sha = await ghPutFile(cfg, await this.seal(snap, rev + 1), remote ? remote.sha : null, remote ? 'Kassensturz: Passwort geändert' : 'Kassensturz: Tresor angelegt'); alive();
          cfg.pwChanged = false; this.markSynced(sha, snap, rev + 1); return 'pushed';
        } catch (e) { if (e.kind === 'conflict') continue; throw e; }
      }

      /* Veralteter Lesestand direkt nach einem eigenen Upload: nicht übernehmen, sonst würde lokale Arbeit überschrieben */
      if (remote.sha !== cfg.sha && (cfg.prev || []).includes(remote.sha)) { this.schedule(6000); return 'uptodate'; }

      let rec;
      try { rec = JSON.parse(remote.text); } catch (e) { throw new SyncError('decrypt', 'Die Datei im Repository ist kein gültiger Tresor.'); }
      const rev = (rec.meta || {}).rev || 0;

      if (remote.sha === cfg.sha && cfg.base) {             // Repository unverändert: nur hochladen, falls hier etwas geändert wurde
        const snap = stripSync(App.state);
        if (sameState(cfg.base, snap)) return 'uptodate';
        try {
          const sha = await ghPutFile(cfg, await this.seal(snap, rev + 1), remote.sha, 'Kassensturz: Änderungen'); alive();
          this.markSynced(sha, snap, rev + 1); return 'pushed';
        } catch (e) { if (e.kind === 'conflict') continue; throw e; }
      }

      const remoteState = stripSync(await this.openRemote(rec)); alive();
      const localSnap = stripSync(App.state);               // direkt vor dem Zusammenführen, ohne Pause dazwischen
      const { merged, conflicts } = merge3State(cfg.base || null, localSnap, remoteState);
      const changedLocal = !sameState(merged, localSnap);
      if (changedLocal) this.applyMerged(merged);
      if (sameState(merged, remoteState)) { this.markSynced(remote.sha, merged, rev); return changedLocal ? 'pulled' : 'uptodate'; }
      try {
        const sha = await ghPutFile(App.state.sync, await this.seal(merged, rev + 1), remote.sha, 'Kassensturz: Änderungen zusammengeführt'); alive();
        this.markSynced(sha, merged, rev + 1); this.conflicts = conflicts; return changedLocal ? 'merged' : 'pushed';
      } catch (e) { if (e.kind === 'conflict') continue; throw e; }
    }
    throw new SyncError('conflict', 'Mehrere Geräte schreiben gleichzeitig. Es wird gleich erneut versucht.');
  },
};

/* ---------- Oberfläche ---------- */
const SYNC_SHORT = { off: '', idle: 'Verbunden', syncing: 'Synchronisiere …', ok: 'Synchronisiert', offline: 'Offline', error: 'Sync-Fehler', password: 'Passwort nötig' };
const syncDot = () => ({ ok: 'ok', syncing: 'busy', offline: 'busy', error: 'bad', password: 'bad' }[Sync.status] || '');

function syncStatusHTML() {
  const c = App.state && App.state.sync;
  if (!c) return '';
  const last = c.last ? `Zuletzt abgeglichen ${fmtStamp(c.last)}.` : 'Noch nicht abgeglichen.';
  const dirty = Sync.dirty() && Sync.status !== 'syncing' ? ' Lokale Änderungen warten auf den Upload.' : '';
  const text = Sync.status === 'error' || Sync.status === 'password' || Sync.status === 'offline' ? Sync.message : (Sync.status === 'syncing' ? 'Synchronisiere …' : `${SYNC_SHORT[Sync.status] || 'Verbunden'}. ${last}`);
  return `<span class="sd ${syncDot()}"></span><span>${esc(text)}${esc(Sync.status === 'ok' || Sync.status === 'idle' ? dirty : '')}</span>`;
}

function refreshSyncUI() {
  const chip = document.getElementById('syncChip');
  const on = Sync.enabled();
  if (chip) {
    chip.hidden = !on;
    if (on) { chip.querySelector('.sd').className = 'sd ' + syncDot(); chip.querySelector('.sync-t').textContent = SYNC_SHORT[Sync.status] || 'Verbunden'; }
  }
  const st = document.getElementById('syncStatus');
  if (st) st.innerHTML = syncStatusHTML();
}

function syncWarning() {
  if (!Sync.enabled()) return null;
  if (Sync.status === 'error' || Sync.status === 'password') return { level: 'warn', tab: 'settings', title: 'Synchronisation', text: Sync.message };
  return null;
}

function syncPanel() {
  const c = App.state.sync;
  if (!c) {
    return `<section class="panel"><div class="panel-h"><h2>Synchronisation</h2></div>
    <p class="lead">Handy und Laptop abgleichen. Der verschlüsselte Tresor liegt dafür in einem privaten GitHub-Repository. GitHub sieht nur Chiffretext, dein Passwort und der Zugriffstoken verlassen das Gerät nie.</p>
    <ol class="steps">
      <li>Lege auf GitHub ein <b>privates</b> Repository an, z. B. <code>kassensturz-daten</code>.</li>
      <li>Erstelle einen Zugriffstoken: GitHub → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token. Bei „Repository access“ wählst du <b>Only select repositories</b> und dein Daten-Repository, bei „Permissions“ → „Repository permissions“ den Eintrag <b>Contents: Read and write</b>. Wähle einen Ablauf, z. B. ein Jahr.</li>
      <li>Verbinde dieses Gerät hier. Auf dem zweiten Gerät wählst du beim Start „Tresor aus GitHub laden“.</li>
    </ol>
    <div class="row-actions"><button class="btn primary" data-act="syncConnect">Mit GitHub verbinden</button></div></section>`;
  }
  return `<section class="panel"><div class="panel-h"><h2>Synchronisation</h2></div>
    <p>Verbunden mit <b>${esc(c.owner)}/${esc(c.repo)}</b>, Datei <code>${esc(c.path)}</code>.</p>
    <div id="syncStatus" class="syncstat">${syncStatusHTML()}</div>
    <div class="row-actions"><button class="btn primary" data-act="syncNow">Jetzt synchronisieren</button><button class="btn" data-act="syncToken">Token erneuern</button><button class="btn" data-act="syncDisconnect">Verbindung trennen</button></div>
    <p class="fine muted tbl-note">Änderungen werden automatisch hochgeladen und beim Öffnen, Zurückkehren in die App und alle paar Minuten abgeholt. Ändern beide Geräte zwischendurch etwas, führt die App die Änderungen eintragsweise zusammen. Bearbeiten auf einem Gerät und Löschen auf dem anderen: die Bearbeitung bleibt. Der Token liegt nur in deinem verschlüsselten Tresor und steht weder im Repository noch in Backups.</p></section>`;
}

/* ---------- Formulare ---------- */
function syncCfgFrom(x) {
  return { owner: String(x.owner || '').trim(), repo: String(x.repo || '').trim().replace(/\.git$/, ''), path: String(x.path || SYNC_FILE).trim() || SYNC_FILE, token: String(x.token || '').trim() };
}
function syncValidateCfg(c) {
  if (!/^[A-Za-z0-9-]+$/.test(c.owner)) return 'Bitte deinen GitHub-Benutzernamen eingeben (nur Buchstaben, Ziffern, Bindestrich).';
  if (!/^[A-Za-z0-9._-]+$/.test(c.repo)) return 'Bitte den Namen des Repositorys eingeben.';
  if (!c.token) return 'Bitte den Zugriffstoken einfügen.';
  if (/^\/|\.\.|\/\//.test(c.path)) return 'Der Dateiname ist ungültig.';
  return null;
}
async function syncCheckRepo(cfg) {
  const info = await ghRepoInfo(cfg);
  if (info.private === false) throw new SyncError('public', 'Dieses Repository ist öffentlich. Dein Tresor ist verschlüsselt, aber lege bitte ein privates Repository an, damit nichts davon öffentlich sichtbar ist.');
}
const syncFields = (renew) => [
  { key: 'owner', label: 'GitHub-Benutzername', type: 'text', half: true, required: true, disabled: renew, placeholder: 'dein-name' },
  { key: 'repo', label: 'Repository (privat)', type: 'text', half: true, required: true, disabled: renew, placeholder: 'kassensturz-daten' },
  { key: 'token', label: 'Zugriffstoken', type: 'password', required: true, hint: 'Fine-grained Token mit „Contents: Read and write“, nur für dieses Repository.' },
  { key: 'path', label: 'Dateiname im Repository', type: 'text', disabled: renew },
];

function askRemotePassword(rec, intro) {
  return new Promise(resolve => {
    let done = false;
    openForm({
      title: 'Passwort bestätigen', submit: 'Weiter', intro,
      fields: [{ key: 'pw', label: 'Passwort', type: 'password', auto: 'current-password', required: true }],
      onSubmit: async x => { try { const r = await openRecord(rec, x.pw); done = true; resolve(r); return null; } catch (e) { return e.message; } },
    });
    Modal.onCancel = () => { if (!done) resolve(null); };
  });
}

function setSyncCfg(cfg, sha, snap, rev) {
  App.state.sync = { ...cfg, sha, prev: [], base: cloneJSON(snap), rev, last: new Date().toISOString() };
}

function syncConnectForm(existing) {
  const renew = !!existing;
  openForm({
    title: renew ? 'Token erneuern' : 'Mit GitHub verbinden',
    intro: renew ? '<p>Trage den neuen Zugriffstoken ein. Repository und Datei bleiben gleich.</p>' : '<p>Das Repository muss <b>privat</b> sein. Im Repository liegt nur die verschlüsselte Tresor-Datei.</p>',
    values: renew ? { owner: existing.owner, repo: existing.repo, path: existing.path, token: '' } : { owner: '', repo: '', path: SYNC_FILE, token: '' },
    fields: syncFields(renew),
    onSubmit: async x => {
      const cfg = syncCfgFrom(x), bad = syncValidateCfg(cfg);
      if (bad) return bad;
      let remote;
      try { await syncCheckRepo(cfg); remote = await ghGetFile(cfg); } catch (e) { return syncErrorText(e); }
      if (renew) {
        App.state.sync.token = cfg.token; persist(); Sync.setStatus('idle'); Sync.run('manual');
        toast('Token gespeichert'); return null;
      }
      if (!remote) {
        const snap = stripSync(App.state);
        const sha = await ghPutFile(cfg, await Sync.seal(snap, 1), null, 'Kassensturz: Tresor angelegt');
        setSyncCfg(cfg, sha, snap, 1);
        persist(); render(); Sync.start();
        toast('Verbunden. Dein verschlüsselter Tresor liegt jetzt im Repository.');
        return null;
      }
      setTimeout(() => syncChoiceForm(cfg, remote), 30);
      return null;
    },
  });
}

function syncChoiceForm(cfg, remote) {
  openForm({
    title: 'Im Repository liegt schon ein Tresor', submit: 'Weiter',
    intro: '<p>Was soll mit dem vorhandenen Tresor geschehen? Sichere vorher bei Bedarf ein Backup.</p>',
    values: { mode: 'merge', pw: '' },
    fields: [
      { key: 'mode', label: 'Vorgehen', type: 'select', options: [
        ['merge', 'Zusammenführen: Daten beider Seiten vereinen (wenn der Tresor von diesem Gerät stammt)'],
        ['load', 'Vorhandenen Tresor laden: die Daten auf diesem Gerät werden ersetzt'],
        ['push', 'Diesen Tresor hochladen: der Tresor im Repository wird überschrieben'],
      ] },
      { key: 'pw', label: 'Passwort des Tresors im Repository', type: 'password', hint: 'Nur nötig, wenn der Tresor im Repository ein anderes Passwort hat (Laden, Zusammenführen).' },
    ],
    onSubmit: async x => {
      let rec;
      try { rec = JSON.parse(remote.text); checkRecord(rec); } catch (e) { return 'Die Datei im Repository ist kein gültiger Tresor.'; }
      const rev = remoteRev(remote.text);
      if (x.mode === 'push') {
        const snap = stripSync(App.state);
        const sha = await ghPutFile(cfg, await Sync.seal(snap, rev + 1), remote.sha, 'Kassensturz: Tresor überschrieben');
        setSyncCfg(cfg, sha, snap, rev + 1); persist(); render(); Sync.start(); toast('Verbunden. Der Tresor im Repository wurde ersetzt.');
        return null;
      }
      const sameKey = rec.salt === b64(App.salt) && rec.iter === App.iter;
      let remoteState;
      if (sameKey) remoteState = await Sync.decryptSameKey(rec);
      else {
        if (!x.pw) return 'Bitte das Passwort des Tresors im Repository eingeben.';
        const r = await openRecord(rec, x.pw);
        App.key = r.key; App.salt = r.salt; App.iter = r.iter; remoteState = r.state;
      }
      if (x.mode === 'load') {
        App.state = remoteState; App.plan = null;
        setSyncCfg(cfg, remote.sha, stripSync(App.state), rev);
        await persist(); render(); Sync.start(); toast('Tresor aus dem Repository geladen und verbunden.');
        return null;
      }
      const { merged } = merge3State(null, stripSync(App.state), stripSync(remoteState));
      const sync = App.state.sync; Object.assign(App.state, merged); App.state.sync = sync; App.plan = null;
      const sha = await ghPutFile(cfg, await Sync.seal(merged, rev + 1), remote.sha, 'Kassensturz: Tresore zusammengeführt');
      setSyncCfg(cfg, sha, merged, rev + 1); persist(); render(); Sync.start(); toast('Verbunden. Die Daten beider Seiten wurden zusammengeführt.');
      return null;
    },
  });
}

/* Zweites Gerät: Tresor aus dem Repository laden (vom Sperrbildschirm aus) */
function syncLoadForm() {
  const has = !!Store.get();
  openForm({
    title: 'Tresor aus GitHub laden', submit: 'Laden und entsperren',
    intro: `<p>Für ein zweites Gerät: Hier holst du den verschlüsselten Tresor aus deinem privaten Repository.${has ? ' <b>Ein vorhandener Tresor auf diesem Gerät wird dabei ersetzt.</b>' : ''}</p>`,
    values: { owner: '', repo: '', path: SYNC_FILE, token: '', pw: '' },
    fields: [...syncFields(false), { key: 'pw', label: 'Passwort deines Tresors', type: 'password', auto: 'current-password', required: true }],
    onSubmit: async x => {
      const cfg = syncCfgFrom(x), bad = syncValidateCfg(cfg);
      if (bad) return bad;
      let remote;
      try { await syncCheckRepo(cfg); remote = await ghGetFile(cfg); } catch (e) { return syncErrorText(e); }
      if (!remote) return 'Im Repository wurde keine Tresor-Datei gefunden. Prüfe Repository und Dateiname.';
      let rec;
      try { rec = JSON.parse(remote.text); } catch (e) { return 'Die Datei im Repository ist kein gültiger Tresor.'; }
      if (!x.pw) return 'Bitte das Passwort deines Tresors eingeben.';
      const r = await openRecord(rec, x.pw);
      Object.assign(App, { state: r.state, key: r.key, salt: r.salt, iter: r.iter, plan: null, tab: 'home', preview: false });
      setSyncCfg(cfg, remote.sha, stripSync(App.state), remoteRev(remote.text));
      await persist(); armIdle(); render(); Sync.start();
      toast('Tresor geladen und verbunden');
      return null;
    },
  });
}

Object.assign(Actions, {
  syncConnect() { if (App.preview) return toast('Im Vorschau-Modus gibt es keine Synchronisation.'); syncConnectForm(null); },
  syncLoad() { if (App.preview) return toast('Im Vorschau-Modus gibt es keine Synchronisation.'); syncLoadForm(); },
  syncToken() { if (App.state && App.state.sync) syncConnectForm(App.state.sync); },
  syncNow() { if (Sync.enabled()) Sync.run('manual'); },
  async syncDisconnect() {
    const r = await askConfirm({ title: 'Verbindung trennen?', text: 'Dieses Gerät gleicht danach nicht mehr ab. Deine Daten hier und die Datei im Repository bleiben unverändert. Der Token wird von diesem Gerät entfernt.', ok: 'Trennen', danger: true });
    if (!r.ok) return;
    App.state.sync = null; Sync.stop(); persist(); render(); toast('Verbindung getrennt');
  },
});

boot();
</script>
</body>
</html>
