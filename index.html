function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

async function deriveKey(pw, salt, iter) {
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function sealRecord(state, key, salt, iter) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: AAD }, key, enc.encode(JSON.stringify(state)));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}

function checkRecord(rec) {
  if (!rec || rec.v !== 1 || typeof rec.salt !== 'string' || typeof rec.iv !== 'string' || typeof rec.ct !== 'string') throw new Error('Das ist keine gültige Kassensturz-Datei.');
  if (!(rec.iter >= 100000 && rec.iter <= 3000000)) throw new Error('Ungültige Verschlüsselungsparameter.');
}

async function openRecord(rec, pw) {
  checkRecord(rec);
  const salt = unb64(rec.salt);
  const key = await deriveKey(pw, salt, rec.iter);
  let plain;
  try {
    plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv), additionalData: AAD }, key, unb64(rec.ct));
  } catch (e) { throw new Error('Falsches Passwort oder beschädigte Daten.'); }
  return { state: normalizeState(JSON.parse(dec.decode(plain))), key, salt, iter: rec.iter };
}

function normalizeState(s) {
  s = s && typeof s === 'object' ? s : {};
  const arr = x => (Array.isArray(x) ? x : []);
  return {
    version: 1,
    settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) },
    recurring: arr(s.recurring), oneoffs: arr(s.oneoffs),
    invoices: arr(s.invoices), installments: arr(s.installments),
    journal: arr(s.journal), oma: arr(s.oma), budgets: arr(s.budgets),
    sync: s.sync && typeof s.sync === 'object' ? s.sync : null,   // Geräte-Einstellung: wird nie synchronisiert oder exportiert
  };
}

let saveChain = Promise.resolve();
function persist() {
  saveChain = saveChain.then(async () => {
    if (!App.state || !App.key) return;
    const rec = await sealRecord(App.state, App.key, App.salt, App.iter);
    Store.set(JSON.stringify(rec));
  }).catch(err => toast('Speichern fehlgeschlagen: ' + err.message, 'bad'));
  return saveChain;
}

async function createVault(pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  App.salt = salt; App.iter = KDF_ITER;
  App.key = await deriveKey(pw, salt, KDF_ITER);
  App.state = normalizeState({});
  await persist();
}

async function unlockVault(pw) {
  const raw = Store.get();
  if (!raw) throw new Error('Kein Tresor gefunden.');
  const r = await openRecord(JSON.parse(raw), pw);
  Object.assign(App, { state: r.state, key: r.key, salt: r.salt, iter: r.iter, plan: null });
}

function lockVault() {
  if (App.preview) { toast('Im Vorschau-Modus gibt es keine Sperre.'); return; }
  clearTimeout(App.idle);
  Sync.stop();
  App.state = null; App.key = null; App.plan = null;
  Modal.close();
  render();
}

function getPlan() {
  if (!App.plan) App.plan = buildPlan(App.state, todayISO());
  return App.plan;
}
function commit() { App.plan = null; persist(); render(); Sync.schedule(); }

function passwordStrength(pw) {
  let pts = 0;
  if (pw.length >= 8) pts++;
  if (pw.length >= 12) pts++;
  if (pw.length >= 16) pts++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) pts++;
  if (/\d/.test(pw)) pts++;
  if (/[^A-Za-z0-9]/.test(pw)) pts++;
  if (/^(.)\1+$/.test(pw)) pts = 0;
  return pts <= 2 ? { n: 1, label: 'Schwach' } : pts <= 3 ? { n: 2, label: 'Okay' } : pts <= 4 ? { n: 3, label: 'Gut' } : { n: 4, label: 'Stark' };
}

/* ---------- Hinweise ---------- */
function toast(msg, kind) {
  const host = $('#toasts');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, kind === 'bad' ? 6000 : 3500);
}

/* ---------- Dialog ---------- */
const Modal = {
  el: null, onCancel: null,
  init() {
    this.el = $('#dlg');
    this.el.addEventListener('click', e => {
      if (e.target === this.el || e.target.closest('[data-close]')) this.cancel();
    });
    this.el.addEventListener('close', () => {
      const f = this.onCancel; this.onCancel = null; this.el.innerHTML = '';
      if (f) f();
    });
  },
  open(html, onCancel) {
    this.el.innerHTML = html;
    this.onCancel = onCancel || null;
    if (this.el.showModal) { if (!this.el.open) this.el.showModal(); } else this.el.setAttribute('open', '');
  },
  close() {
    this.onCancel = null;
    if (this.el.close) { if (this.el.open) this.el.close(); } else this.el.removeAttribute('open');
    this.el.innerHTML = '';
  },
  cancel() { const f = this.onCancel; this.close(); if (f) f(); },
};

function askConfirm({ title, text, ok = 'Bestätigen', danger = false, check = null }) {
  return new Promise(resolve => {
    Modal.open(`<form class="dlg-form" method="dialog">
      <header><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Schließen">×</button></header>
      ${text ? `<p class="lead">${esc(text)}</p>` : ''}
      ${check ? `<label class="chk"><input type="checkbox" id="cchk" ${check.checked ? 'checked' : ''}><span>${esc(check.label)}</span></label>` : ''}
      <footer><button type="button" class="btn ghost" data-close>Abbrechen</button>
      <button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(ok)}</button></footer></form>`,
      () => resolve({ ok: false }));

      e.preventDefault();

/* ---------- Formulare ---------- */
const fmtNumInput = v => (typeof v === 'number' ? String(v).replace('.', ',') : String(v == null ? '' : v));

function fieldHTML(f, v) {
  const id = 'f_' + f.key;
  const common = `id="${id}" name="${f.key}" ${f.required ? 'required' : ''} ${f.disabled ? 'disabled' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}`;
  let input;
  switch (f.type) {
    case 'select':
      input = `<select ${common}>${f.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
      break;
    case 'checkbox':
      return `<label class="chk full"><input type="checkbox" id="${id}" name="${f.key}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span>${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
    case 'money': case 'percent':
      input = `<div class="affix"><input ${common} type="text" inputmode="decimal" autocomplete="off" value="${esc(v == null || v === '' ? '' : fmtNumInput(v))}"><i>${f.type === 'money' ? '€' : '%'}</i></div>`;
      break;
    case 'number':
      input = `<input ${common} type="number" inputmode="numeric" step="1" min="0" value="${esc(v == null ? '' : v)}">`;
      break;
    case 'date':
      input = `<input ${common} type="date" value="${esc(v || '')}" ${f.min ? `min="${esc(f.min)}"` : ''} ${f.max ? `max="${esc(f.max)}"` : ''}>`;
      break;
    case 'password':
      input = `<input ${common} type="password" autocomplete="${f.auto || 'off'}" value="">`;
      break;
    case 'textarea':
      input = `<textarea ${common} rows="${f.rows || 6}" spellcheck="false">${esc(v || '')}</textarea>`;
      break;
    default:
      input = `<input ${common} type="text" autocomplete="off" value="${esc(v == null ? '' : v)}" ${f.list ? `list="dl_${f.key}"` : ''}>` +
        (f.list ? `<datalist id="dl_${f.key}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
  }
  return `<label class="f ${f.half ? 'half' : ''}"><span>${esc(f.label)}</span>${input}<small id="h_${f.key}">${f.hint ? esc(f.hint) : ''}</small></label>`;
}

function readFields(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.key];
    if (!el) continue;
    if (f.type === 'checkbox') out[f.key] = el.checked;
    else if (f.type === 'money' || f.type === 'percent') out[f.key] = parseNum(el.value);
    else if (f.type === 'number') out[f.key] = el.value === '' ? NaN : Number(el.value);
    else if (f.type === 'password') out[f.key] = el.value;
    else out[f.key] = String(el.value || '').trim();
  }
  return out;
}

function makeApi(form, fields) {
  return {
    get: k => readFields(form, fields)[k],
    all: () => readFields(form, fields),
    set: (k, v) => { const el = form.elements[k]; if (!el) return; if (el.type === 'checkbox') el.checked = !!v; else el.value = fmtNumInput(v); },
    hint: (k, t) => { const el = $('#h_' + k, form); if (el) el.textContent = t; },
    options: (k, opts, val) => {
      const el = form.elements[k]; if (!el) return;
      el.innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
      if (val != null) el.value = val;
    },
    preview: html => { const el = $('#fpreview', form); if (el) el.innerHTML = html || ''; },
  };
}

/* cfg: {title, intro, fields, values, submit, onInput(api,key), onSubmit(vals,api)→Fehlertext|null|Promise, wide} */
function openForm(cfg) {
  const vals = cfg.values || {};
  Modal.open(`<form class="dlg-form ${cfg.wide ? 'wide' : ''}" novalidate>
    <header><h2>${esc(cfg.title)}</h2><button type="button" class="x" data-close aria-label="Schließen">×</button></header>
    ${cfg.intro ? `<div class="lead">${cfg.intro}</div>` : ''}
    <div class="fgrid">${cfg.fields.map(f => fieldHTML(f, vals[f.key])).join('')}</div>
    <div class="preview" id="fpreview" aria-live="polite"></div>
    <p class="err" id="ferr" role="alert"></p>
    <footer><button type="button" class="btn ghost" data-close>Abbrechen</button>
    <button type="submit" class="btn primary">${esc(cfg.submit || 'Speichern')}</button></footer></form>`);
  const form = $('form', Modal.el);
  const api = makeApi(form, cfg.fields);
  const run = e => { if (cfg.onInput) cfg.onInput(api, e && e.target ? e.target.name : null); };
  form.addEventListener('input', run);
  form.addEventListener('change', run);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', form);
    btn.disabled = true;
    try {
      const err = await cfg.onSubmit(api.all(), api);
      if (err) { $('#ferr', form).textContent = err; btn.disabled = false; return; }
      Modal.close();
    } catch (ex) { $('#ferr', form).textContent = ex.message || String(ex); btn.disabled = false; }
  });
  if (cfg.onInput) cfg.onInput(api, null);
  const first = $('input:not([type=checkbox]),select,textarea', form);
  if (first && !/Mobi|Android/i.test(navigator.userAgent)) first.focus();
  return api;
}

/* =====================================================================
   DIAGRAMME
   ===================================================================== */
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* cfg: {n, height, series:[{name,values,cls,area,dash}], buffer, dateAt(i), markers:[{i,cls,title}], eventsAt(i)} */
function drawLineChart(host, cfg) {
  const W = Math.max(300, Math.floor(host.clientWidth || 640));
  const H = cfg.height || 260;
  const m = { l: 56, r: 14, t: 16, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = cfg.n;
  let lo = 0, hi = 0;
  for (const s of cfg.series) for (let i = 0; i < n; i++) { const v = s.values[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  if (cfg.buffer != null) { lo = Math.min(lo, cfg.buffer); hi = Math.max(hi, cfg.buffer); }
  if (hi - lo < 1) hi = lo + 1;
  const step = niceStep((hi - lo) / 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.l + (n <= 1 ? 0 : (i / (n - 1)) * iw);
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const y0 = y(0);
  const uidc = 'c' + Math.random().toString(36).slice(2, 8);

  let grid = '';
  for (let k = 0; ; k++) {
    const v = lo + k * step;
    if (v > hi + step * 1e-6) break;
    const yy = y(v).toFixed(1);
    grid += `<line class="gl${Math.abs(v) < 1e-9 ? ' gz' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/>` +
      `<text class="ax" x="${m.l - 8}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${esc(fmtCompact(v))}</text>`;
  }
  let xt = '', lastX = -999;
  for (let i = 0; i < n; i++) {
    const d = cfg.dateAt(i);
    if (cfg.xDays ? i % 7 === 0 : (i === 0 || d.endsWith('-01'))) {
      const px = x(i);
      if (px - lastX < 62) continue;
      lastX = px;
      const label = i === 0 ? (cfg.firstLabel || 'heute') : (cfg.xDays ? fmtShort(d) : fmtMonthKey(d.slice(0, 7)));
      xt += `<text class="ax" x="${px.toFixed(1)}" y="${H - 7}" text-anchor="${i === 0 ? 'start' : 'middle'}">${esc(label)}</text>`;
    }
  }

  const pathOf = vals => { let p = ''; for (let i = 0; i < n; i++) p += (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(vals[i]).toFixed(1); return p; };
  let body = '';
  const areaBase = Math.min(Math.max(y0, m.t), H - m.b);
  const defs = `<defs><linearGradient id="${uidc}g" x1="0" y1="0" x2="0" y2="1"><stop class="gs0" offset="0"/><stop class="gs1" offset="1"/></linearGradient><clipPath id="${uidc}p"><rect x="0" y="0" width="${W}" height="${Math.max(0, y0).toFixed(1)}"/></clipPath>` +
    `<clipPath id="${uidc}n"><rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${H}"/></clipPath></defs>`;

  if (cfg.buffer != null) {
    body += `<line class="buf" x1="${m.l}" x2="${W - m.r}" y1="${y(cfg.buffer).toFixed(1)}" y2="${y(cfg.buffer).toFixed(1)}"/>`;
  }
  for (const s of cfg.series) {
    const p = pathOf(s.values);
    if (s.area) {
      const ap = `${p}L${x(n - 1).toFixed(1)},${areaBase.toFixed(1)}L${x(0).toFixed(1)},${areaBase.toFixed(1)}Z`;
      body += `<path class="area pos" fill="url(#${uidc}g)" d="${ap}" clip-path="url(#${uidc}p)"/><path class="area neg" d="${ap}" clip-path="url(#${uidc}n)"/>`;
      body += `<path class="ln ${s.cls}" pathLength="1" d="${p}" clip-path="url(#${uidc}p)"/><path class="ln neg" pathLength="1" d="${p}" clip-path="url(#${uidc}n)"/>`;
    } else {
      body += `<path class="ln ${s.cls}${s.dash ? ' dash' : ''}" ${s.dash ? '' : 'pathLength="1"'} d="${p}"/>`;
    }
  }
  for (const [idx, mk] of (cfg.markers || []).entries()) {
    const v = cfg.series[0].values[mk.i];
    body += `<circle class="mk ${mk.cls}" style="--k:${Math.min(idx, 40)}" cx="${x(mk.i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5"><title>${esc(mk.title || '')}</title></circle>`;
  }
  const cursor = `<line class="cur" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>` +
    cfg.series.map((s, k) => `<circle class="dot ${s.cls}" data-k="${k}" r="4" visibility="hidden"/>`).join('');

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.label || 'Verlauf')}">${defs}${grid}${xt}${body}${cursor}<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/></svg><div class="tip" hidden></div>`;

  const svg = $('svg', host), tip = $('.tip', host), cur = $('.cur', svg), dots = $$('.dot', svg);
  const hide = () => { cur.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); tip.hidden = true; };
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    let i = Math.round(((px - m.l) / iw) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const xx = x(i);
    cur.setAttribute('x1', xx); cur.setAttribute('x2', xx); cur.setAttribute('visibility', 'visible');
    dots.forEach((d, k) => { d.setAttribute('cx', xx); d.setAttribute('cy', y(cfg.series[k].values[i])); d.setAttribute('visibility', 'visible'); });
    const evs = cfg.eventsAt ? cfg.eventsAt(i) : [];
    tip.innerHTML = `<b>${esc(fmtWd(cfg.dateAt(i)))}</b>` +
      cfg.series.map(s => `<div class="tr"><i class="sw ${s.cls}${s.dash ? ' dash' : ''}"></i><span>${esc(s.name)}</span><b class="money">${esc(fmtEUR(s.values[i]))}</b></div>`).join('') +
      (evs.length ? `<div class="te">${evs.slice(0, 5).map(t => `<div>${esc(t)}</div>`).join('')}${evs.length > 5 ? `<div>… +${evs.length - 5} weitere</div>` : ''}</div>` : '');
    tip.hidden = false;
    const scale = r.width / W;
    const left = xx * scale;
    tip.style.left = (left > r.width * 0.62 ? left - tip.offsetWidth - 12 : left + 12) + 'px';
    tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', hide);
}

/* Zeitfenster des Filters in der Übersicht: „Dieser Monat“, „Nächster Monat“ oder 3 bis 24 Monate ab heute.
   c = Diagramm, r = Frist-Leiste, l = Liste „Als Nächstes“ (jeweils Tagesindex ab heute). */
function rangeWindow(P) {
  const d0 = P.ctx.d0, n = P.ctx.n, { y, m } = parseISO(P.today), r = App.range;
  const eom = (yy, mm) => dayNum(iso(yy, mm, dim(yy, mm))) - d0;
  const win = (i0, i1, mode, key) => { i0 = Math.min(i0, n - 2); i1 = Math.min(n - 1, Math.max(i1, i0 + 1)); return { mode, key, c0: i0, c1: i1, r0: i0, r1: i1, l0: i0, l1: i1 }; };
  if (r === 'cur') return win(0, eom(y, m), 'cur', P.today.slice(0, 7));
  if (r === 'next') {
    const [ny, nm] = m === 12 ? [y + 1, 1] : [y, m + 1];
    return win(dayNum(iso(ny, nm, 1)) - d0, eom(ny, nm), 'next', iso(ny, nm, 1).slice(0, 7));
  }
  const months = Number(r) || 12;
  return { mode: 'range', key: null, c0: 0, c1: Math.min(n - 1, dayNum(addMonths(P.today, months)) - d0), r0: 0, r1: Math.min(30, n - 1), l0: 0, l1: 21 };
}

function drawCharts() {
  const P = getPlan();
  $$('[data-ribbon]').forEach(h => drawRibbon(h, P));
  $$('[data-chart]').forEach(host => {
    const kind = host.dataset.chart;
    if (kind === 'balance') {
      const W = rangeWindow(P), i0 = W.c0, i1 = W.c1, nn = i1 - i0 + 1;
      const markers = P.opt.log.filter(e => e.i >= i0 && e.i <= i1 && (e.type === 'invoice' || e.type === 'prepay'))
        .map(e => ({ i: e.i - i0, cls: e.type === 'invoice' ? 'inv' : 'pre', title: `${e.name}: ${fmtEUR(-e.amount)}` }));
      drawLineChart(host, {
        n: nn, height: 270, label: 'Kontostand-Prognose', dateAt: i => P.dateAt(i + i0), buffer: P.ctx.settings.buffer,
        xDays: W.mode !== 'range', firstLabel: i0 === 0 ? 'heute' : fmtShort(P.dateAt(i0)),
        series: [{ name: 'Kontostand', values: P.opt.days.slice(i0, i1 + 1), cls: 'pri', area: true }, ...(P.reserveMax > 0.005 ? [{ name: 'Eigenes Geld', values: P.opt.own.slice(i0, i1 + 1), cls: 'ref', dash: true }] : [])],
        markers,
        eventsAt: i => P.opt.log.filter(e => e.i === i + i0 && e.amount !== 0).map(e => `${e.type === 'prepay' ? 'Sondertilgung: ' : ''}${e.name} ${fmtEUR(e.amount)}`),
      });
    } else if (kind === 'debt') {
      drawLineChart(host, {
        n: P.ctx.n, height: 240, label: 'Schuldenverlauf', dateAt: P.dateAt,
        series: [
          { name: 'Nur Pflichtzahlungen', values: P.base.debtDays, cls: 'ref', dash: true },
          { name: 'Mit Strategie', values: P.opt.debtDays, cls: 'pri' },
        ],
        eventsAt: i => P.opt.log.filter(e => e.i === i && (e.type === 'prepay' || e.type === 'invoice' || e.type === 'rate')).map(e => `${e.type === 'prepay' ? 'Sondertilgung: ' : ''}${e.name} ${fmtEUR(e.amount)}`),
      });
    }
  });
}

/* =====================================================================
   ANSICHTEN
   ===================================================================== */
const TYPE_ORDER = { income: 0, oma_in: 0, invoice: 1, rate: 2, prepay: 3, oma_out: 3, expense: 4, flex: 5 };

function tagFor(e, inPlan) {
  if (e.type === 'flex') return '<span class="tag">Budget</span>';
  if (e.type === 'invoice') return e.overdue ? '<span class="stamp">Überfällig</span>' : `<span class="mark">Frist ${esc(fmtShort(fromDayNum(e.due)))}</span>`;
  if (e.type === 'rate') return e.overdue ? '<span class="stamp">Überfällig</span>' : (inPlan ? '' : '<span class="tag">Rate</span>');
  if (e.type === 'prepay') return inPlan ? '' : '<span class="tag acc">Sondertilgung</span>';
  return '';
}

function eventRows(P, l0, l1) {
  const list = P.opt.log.filter(e => e.i >= l0 && e.i <= l1 && e.amount !== 0 && (e.type !== 'flex' || e.lump))
    .sort((a, b) => a.t - b.t || TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
  if (!list.length) return '<p class="empty">In diesem Zeitraum stehen keine Buchungen an.</p>';
  const groups = new Map();
  for (const e of list) { if (!groups.has(e.t)) groups.set(e.t, []); groups.get(e.t).push(e); }
  const row = e => `<li class="ev ${e.type}"><span class="ev-n"><b>${esc(e.name)}</b>${e.provider ? `<span class="tag plat">${esc(e.provider)}</span>` : ''} ${tagFor(e)}</span><span class="ev-a ${e.amount > 0 ? 'pos' : ''}">${money(e.amount)}</span></li>`;
  return `<div class="tl">${[...groups.entries()].map(([t, evs]) => {
    const diff = t - P.ctx.d0, date = fromDayNum(t);
    const label = diff === 0 ? 'Heute' : diff === 1 ? 'Morgen' : fmtWd(date);
    const sub = diff <= 1 ? fmtWd(date) : relDays(date, P.today);
    const sum = evs.reduce((a, e) => a + e.amount, 0);
    return `<section class="tl-day ${diff === 0 ? 'today' : ''} ${evs.some(e => e.overdue) ? 'late' : ''}"><div class="tl-h"><div><b>${esc(label)}</b> <span>${esc(sub)}</span></div><span class="tl-sum money">${esc(fmtEUR(sum))}</span></div><ul class="evs">${evs.map(row).join('')}</ul></section>`;
  }).join('')}</div>`;
}

function backupReminder() {
  const st = App.state;
  const hasData = st.recurring.length + st.oneoffs.length + st.invoices.length + st.installments.length > 0;
  if (!hasData) return null;
  const lb = st.settings.lastBackup;
  if (!lb) return { level: 'info', tab: 'settings', title: 'Noch kein Backup', text: 'Deine Daten liegen nur in diesem Browser. Wird der Browser-Speicher gelöscht, sind sie weg. Exportiere ein verschlüsseltes Backup.' };
  if (dayNum(todayISO()) - dayNum(lb) > 30) return { level: 'info', tab: 'settings', title: 'Backup auffrischen', text: `Dein letztes Backup ist vom ${fmtDate(lb)}. Exportiere ein neues, damit nichts verloren geht.` };
  return null;
}

function warningList(P) {
  const ws = [...P.warnings];
  const br = backupReminder(); if (br) ws.push(br);
  const sw = syncWarning(); if (sw) ws.push(sw);
  if (!ws.length) return '<p class="calm"><b>Alles im grünen Bereich.</b> Keine Frist in Gefahr, kein Engpass in Sicht.</p>';
  const order = { bad: 0, warn: 1, info: 2 };
  ws.sort((a, b) => order[a.level] - order[b.level]);
  return `<ul class="notes">${ws.map(w => `<li class="note ${w.level}"><b>${esc(w.title)}</b><span>${esc(w.text)}</span>${w.tab ? `<button class="link" data-act="nav" data-tab="${w.tab}">Öffnen</button>` : ''}</li>`).join('')}</ul>`;
}

function min30(P) {
  const o = P.opt, lim = Math.min(30, P.ctx.n - 1), arr = P.reserveMax > 0.005 ? o.own : o.days;
  let v = Infinity, i = 0;
  for (let k = 0; k <= lim; k++) if (arr[k] < v) { v = arr[k]; i = k; }
  return { v, i };
}

function verdictHTML(P) {
  const o = P.opt, sum = o.sum, set = P.ctx.settings;
  let main;
  if (sum.firstNeg >= 0) main = `<span class="stamp">Engpass</span><span>Am ${esc(fmtDate(P.dateAt(sum.firstNeg)))} fehlen ${money(-o.days[sum.firstNeg])}.</span>`;
  else if (sum.firstBuf >= 0) main = `<span class="mark">Knapp</span><span>Ab ${esc(fmtDate(P.dateAt(sum.firstBuf)))} liegt der Kontostand unter dem Puffer von ${money(set.buffer)}.</span>`;
  else main = `<span class="tag ok">Gedeckt</span><span>Alle Zahlungen der nächsten ${set.horizonMonths} Monate sind abgesichert.</span>`;
  return `<div class="verdict"><p class="v-main">${main}</p></div>`;
}

function categoryBars(P) {
  const cats = Object.entries(P.stats.byCat).sort((a, b) => b[1] - a[1]);
  if (!cats.length) return '<p class="empty">Noch keine Fixkosten erfasst.</p>';
  const max = cats[0][1];
  return `<ul class="bars">${cats.map(([c, v], k) => `<li style="--bc:var(--c${(k % 6) + 1})"><span class="b-l">${esc(c)}</span><span class="b-t"><i style="width:${Math.max(3, (v / max) * 100).toFixed(1)}%"></i></span><span class="b-v">${money(v)}</span></li>`).join('')}</ul>`;
}

const fabHTML = () => `<button class="fab" data-act="addExpense" aria-label="Ausgabe erfassen">${icon('plus')}</button>`;
const kpi = (label, value, sub, o = {}) => {
  const inner = `<span class="k-l">${esc(label)}</span><span class="k-v money ${o.cls || ''}">${esc(value)}</span><span class="k-s">${esc(sub || '')}</span>`;
  return o.tab ? `<button class="kpi" data-act="nav" data-tab="${o.tab}">${inner}</button>` : `<div class="kpi">${inner}</div>`;
};

function invoiceCard(inv, P) {
  const today = P.today;
  const diff = dayNum(inv.due) - dayNum(today);
  const overdue = diff < 0;
  const dbg = P.ctx.debts.find(d => d.id === inv.id);
  const payDate = dbg ? P.dateAt(dbg.payDay - P.ctx.d0) : null;
  let pct = null;
  if (inv.purchaseDate && validISO(inv.purchaseDate)) {
    const total = dayNum(inv.due) - dayNum(inv.purchaseDate);
    if (total > 0) pct = Math.min(100, Math.max(0, ((dayNum(today) - dayNum(inv.purchaseDate)) / total) * 100));
  }
  const urgency = overdue ? 'bad' : diff <= 3 ? 'bad' : diff <= 7 ? 'warn' : 'ok';
  return `<li class="item ${overdue ? 'is-over' : ''}">
    <div class="item-main">
      <div class="item-t"><b>${esc(inv.name)}</b>${inv.provider ? `<span class="tag">${esc(inv.provider)}</span>` : ''}${overdue ? '<span class="stamp">Überfällig</span>' : ''}</div>
      <div class="item-s"><span class="mark">Frist ${esc(fmtDate(inv.due))}</span> <span class="rel ${urgency}">${esc(relDays(inv.due, today))}</span></div>
      ${pct != null ? `<div class="term"><i style="width:${pct.toFixed(0)}%"></i></div><div class="fine muted">Zahlungsziel zu ${pct.toFixed(0)} % verstrichen</div>` : ''}
      <div class="item-n">${payDate ? (payDate === today ? 'Plan: heute überweisen.' : `Plan: am ${esc(fmtWd(payDate))} überweisen${P.ctx.settings.payBufferDays ? ` (${P.ctx.settings.payBufferDays} Tage vor Fristende)` : ''}. Bis dahin bleibt das Geld verfügbar.`) : 'Außerhalb des Planungshorizonts.'}</div>
    </div>
    <div class="item-side">
      <div class="item-amt">${money(inv.amount)}</div>
      <div class="item-btns"><button class="btn sm primary" data-act="payInvoice" data-id="${esc(inv.id)}">Bezahlt</button><button class="btn sm" data-act="editInvoice" data-id="${esc(inv.id)}">Bearbeiten</button><button class="btn sm ghost" data-act="delInvoice" data-id="${esc(inv.id)}">Löschen</button></div>
    </div>
  </li>`;
}

function installmentCard(it, P) {
  const base = P.base.debts.find(d => d.id === it.id);
  const months = base && base.paidOffT ? Math.round((base.paidOffT - P.ctx.d0) / 30.4) : null;
  const am = amortize(it.balance, it.payment, it.rate);
  const over = validISO(it.nextDue) && dayNum(it.nextDue) < dayNum(P.today);
  return `<li class="item ${over ? 'is-over' : ''}">
    <div class="item-main">
      <div class="item-t"><b>${esc(it.name)}</b>${it.provider ? `<span class="tag">${esc(it.provider)}</span>` : ''}<span class="tag ${it.rate > 0 ? 'warnt' : 'ok'}">${it.rate > 0 ? esc(fmtPct(it.rate)) + ' p. a.' : 'zinsfrei'}</span>${over ? '<span class="stamp">Überfällig</span>' : ''}</div>
      <div class="item-s">Rate ${money(it.payment)} am ${esc(fmtDate(it.nextDue))} <span class="rel">${esc(relDays(it.nextDue, P.today))}</span></div>
      <div class="item-n">${am.ok ? `Noch ${am.months} Raten${months != null ? ` (bis ca. ${esc(fmtDate(base ? fromDayNum(base.paidOffT) : ''))})` : ''}${it.rate > 0 ? `, Zinsen insgesamt ca. ${esc(fmtEUR(am.interest))}` : ''}.` : '<b>Die Rate deckt die Zinsen nicht.</b>'} ${it.allowPrepay ? 'Sondertilgung erlaubt.' : 'Keine Sondertilgung.'}</div>
    </div>
    <div class="item-side">
      <div class="item-amt">${money(it.balance)}<small>Restschuld</small></div>
      <div class="item-btns"><button class="btn sm primary" data-act="payInstallment" data-id="${esc(it.id)}">Rate bezahlt</button><button class="btn sm" data-act="prepayInstallment" data-id="${esc(it.id)}">Sondertilgung</button><button class="btn sm" data-act="editInstallment" data-id="${esc(it.id)}">Bearbeiten</button><button class="btn sm ghost" data-act="delInstallment" data-id="${esc(it.id)}">Löschen</button></div>
    </div>
  </li>`;
}

function viewDebts() {
  const P = getPlan(), st = App.state;
  const open = st.invoices.filter(i => !i.paid).sort((a, b) => a.due.localeCompare(b.due));
  const paid = st.invoices.filter(i => i.paid).sort((a, b) => (b.paidDate || '').localeCompare(a.paidDate || ''));
  const inst = st.installments.filter(i => i.balance > 0.005).sort((a, b) => a.nextDue.localeCompare(b.nextDue));
  const done = st.installments.filter(i => !(i.balance > 0.005));
  const nextItems = [...open.map(i => ({ d: i.due, n: i.name })), ...inst.map(i => ({ d: i.nextDue, n: i.name }))].filter(x => validISO(x.d)).sort((a, b) => a.d.localeCompare(b.d));
  const nx = nextItems[0];
  const strip = `<div class="strip">
    ${kpi('Offene Rechnungen', fmtEUR(open.reduce((a, i) => a + i.amount, 0)), `${open.length} ${open.length === 1 ? 'Rechnung' : 'Rechnungen'}`)}
    ${kpi('Restschuld Raten', fmtEUR(inst.reduce((a, i) => a + i.balance, 0)), `${inst.length} ${inst.length === 1 ? 'Ratenzahlung' : 'Ratenzahlungen'}`)}
    ${kpi('Raten pro Monat', fmtEUR(P.stats.rates), `Zinsen bis zum Ende ${fmtEUR(P.opt.interest)}`)}
    ${kpi('Nächste Frist', nx ? relDays(nx.d, P.today) : 'keine', nx ? `${nx.n} am ${fmtDate(nx.d)}` : 'Nichts offen', { tab: 'plan' })}
  </div>`;
  return `<header class="page-head"><div><h1>Rechnungen &amp; Raten</h1><p class="sub">Kauf auf Rechnung (PayPal, Klarna, Händler) und Ratenzahlungen mit allen Fristen.</p></div>
    <div class="actions"><button class="btn" data-act="quick">Schnell-Erfassung</button><button class="btn" data-act="addInvoice">Rechnung</button><button class="btn primary" data-act="addInstallment">Ratenzahlung</button></div></header>
  ${strip}
  <section class="panel"><div class="panel-h"><h2>Kauf auf Rechnung</h2><span class="muted">${open.length ? `${money(open.reduce((a, i) => a + i.amount, 0))} offen` : ''}</span></div>
    ${open.length ? `<ul class="items">${open.map(i => invoiceCard(i, P)).join('')}</ul>` : '<p class="empty">Keine offenen Rechnungen. Mit „Rechnung“ trägst du PayPal-, Klarna- oder Händlerrechnungen samt Zahlungsziel ein.</p>'}
    ${paid.length ? `<details class="fold"><summary>Bezahlt (${paid.length})</summary><ul class="items quiet">${paid.map(i => `<li class="item"><div class="item-main"><div class="item-t"><b>${esc(i.name)}</b>${i.provider ? `<span class="tag">${esc(i.provider)}</span>` : ''}</div><div class="item-s">bezahlt am ${esc(fmtDate(i.paidDate))}</div></div><div class="item-side"><div class="item-amt">${money(i.amount)}</div><div class="item-btns"><button class="btn sm ghost" data-act="delInvoice" data-id="${esc(i.id)}">Löschen</button></div></div></li>`).join('')}</ul></details>` : ''}
  </section>
  <section class="panel"><div class="panel-h"><h2>Ratenzahlungen</h2><span class="muted">${inst.length ? `${money(inst.reduce((a, i) => a + i.balance, 0))} Restschuld` : ''}</span></div>
    ${inst.length ? `<ul class="items">${inst.map(i => installmentCard(i, P)).join('')}</ul>` : '<p class="empty">Keine laufenden Ratenzahlungen.</p>'}
    ${done.length ? `<details class="fold"><summary>Abbezahlt (${done.length})</summary><ul class="items quiet">${done.map(i => `<li class="item"><div class="item-main"><div class="item-t"><b>${esc(i.name)}</b></div></div><div class="item-side"><div class="item-btns"><button class="btn sm ghost" data-act="delInstallment" data-id="${esc(i.id)}">Löschen</button></div></div></li>`).join('')}</ul></details>` : ''}
  </section>`;
}

function strategyNote(it, prepaid, firstPrepay) {
  if (it.apr <= 0) return '0 % Zinsen: planmäßig zahlen. Das Geld bleibt auf dem Konto verfügbar.';
  if (!it.allowPrepay) return 'Sondertilgung nicht möglich: Rate pünktlich zahlen.';
  if (prepaid > 0) return `Sondertilgung ${fmtEUR(prepaid)} geplant, erste am ${fmtDate(firstPrepay)}.`;
  return 'Aktuell kein freier Spielraum über dem Sicherheitspuffer.';
}

function viewPlan() {
  const P = getPlan(), st = App.state;
  const debts = P.ctx.debts;
  const head = `<header class="page-head"><div><h1>Abzahlungsstrategie</h1><p class="sub">Ausgewogen: keine Frist verpassen, Geld so lange wie möglich behalten, teuerste Raten zuerst tilgen.</p></div></header>`;
  if (!debts.length) return head + '<section class="panel"><p class="empty">Keine offenen Rechnungen oder Raten. Sobald du welche erfasst, entsteht hier dein Zahlungsplan.</p><div class="row-actions"><button class="btn primary" data-act="nav" data-tab="debts">Rechnungen &amp; Raten erfassen</button></div></section>';

  const fmtFree = (r) => r.sum.debtFree >= 0 ? fmtDate(P.dateAt(r.sum.debtFree)) : `nach ${P.ctx.settings.horizonMonths} Monaten`;
  const strip = `<div class="strip">
    ${kpi('Zinsen nur mit Pflichtraten', fmtEUR(P.base.interest), `schuldenfrei ${fmtFree(P.base)}`)}
    ${kpi('Zinsen mit Strategie', fmtEUR(P.opt.interest), `schuldenfrei ${fmtFree(P.opt)}`)}
    ${kpi('Zinsersparnis', fmtEUR(P.savings), P.savings > 0.5 ? 'durch Sondertilgungen' : 'aktuell nichts zu sparen', { cls: P.savings > 0.5 ? 'pos' : '' })}
    ${kpi('Offene Schulden', fmtEUR(P.totalDebt), 'Rechnungen und Raten')}
  </div>`;
  const chartPanel = `<section class="panel"><div class="panel-h"><h2>Schuldenverlauf</h2></div>
    <p class="saving">${P.savings > 0.5 ? `Ersparnis durch Sondertilgungen: <b>${money(P.savings)}</b> Zinsen.` : 'Keine Zinsersparnis möglich: entweder sind alle Raten zinsfrei oder es gibt aktuell keinen freien Spielraum.'}</p>
    <div class="chart" data-chart="debt"></div>
    <p class="legend"><span><i class="lg ref"></i>Nur Pflichtzahlungen</span><span><i class="lg pri"></i>Mit Strategie</span></p>
  </section>`;

  const steps = P.opt.log.filter(e => ['rate', 'invoice', 'prepay'].includes(e.type) && e.i <= 60)
    .sort((a, b) => a.t - b.t || TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
  const why = e => {
    if (e.type === 'invoice') {
      if (e.overdue) return 'Bereits überfällig: sofort überweisen, um Mahngebühren zu vermeiden.';
      const left = e.due - e.t;
      return left <= 0 ? 'Letzter Tag der Frist.' : `${left} ${left === 1 ? 'Tag' : 'Tage'} vor Fristende: so lange bleibt das Geld verfügbar, ohne dass die Frist gefährdet ist.`;
    }
    if (e.type === 'rate') return e.overdue ? 'Überfällig: nachholen.' : `Pflichtrate${e.apr > 0 ? `, davon ca. ${fmtEUR(e.interest)} Zinsen` : ' (zinsfrei)'}.`;
    return `Freies Geld über dem Puffer. Höchster Zinssatz zuerst (${fmtPct(e.apr)}).`;
  };
  const stepsHTML = steps.length ? `<ul class="plan">${steps.map(e => {
    const kind = e.type === 'invoice' ? 'Rechnung zahlen' : e.type === 'rate' ? 'Rate zahlen' : 'Sondertilgung';
    return `<li class="pl ${e.type}"><span class="pl-d">${esc(fmtWd(P.dateAt(e.i)))}</span><div class="pl-m"><b>${esc(e.name)}</b> ${tagFor(e, true)}<span class="pl-k">${esc(kind)}</span><p>${esc(why(e))}</p></div><span class="pl-a">${money(e.amount)}</span></li>`;
  }).join('')}</ul>` : '<p class="empty">In den nächsten 60 Tagen ist keine Zahlung geplant.</p>';

  const invRank = debts.filter(d => d.kind === 'inv').sort((a, b) => a.due - b.due);
  const instRank = debts.filter(d => d.kind === 'inst').sort((a, b) => b.apr - a.apr || a.B0 - b.B0);
  const optBy = Object.fromEntries(P.opt.debts.map(d => [d.id, d]));
  const baseBy = Object.fromEntries(P.base.debts.map(d => [d.id, d]));
  const prep = {};
  for (const e of P.opt.log) if (e.type === 'prepay') { (prep[e.id] || (prep[e.id] = { sum: 0, first: P.dateAt(e.i) })).sum += -e.amount; }

  const invHTML = invRank.length ? `<ol class="rank">${invRank.map((d, k) => `<li><span class="rk">${k + 1}</span><div><b>${esc(d.name)}</b>${d.provider ? ` <span class="tag">${esc(d.provider)}</span>` : ''}<p>${d.overdue ? 'Überfällig: sofort zahlen.' : `Überweisen am ${esc(fmtDate(P.dateAt(d.payDay - P.ctx.d0)))}. Frist: <span class="mark">${esc(fmtDate(fromDayNum(d.due)))}</span>`}</p></div><span>${money(d.amount)}</span></li>`).join('')}</ol>` : '<p class="empty">Keine offenen Rechnungen.</p>';
  const instHTML = instRank.length ? `<ol class="rank">${instRank.map((d, k) => {
    const o = optBy[d.id], b = baseBy[d.id], pr = prep[d.id];
    const end = o && o.paidOffT ? fmtDate(fromDayNum(o.paidOffT)) : null;
    const endB = b && b.paidOffT ? fmtDate(fromDayNum(b.paidOffT)) : null;
    return `<li><span class="rk">${k + 1}</span><div><b>${esc(d.name)}</b> <span class="tag ${d.apr > 0 ? 'warnt' : 'ok'}">${d.apr > 0 ? esc(fmtPct(d.apr)) : 'zinsfrei'}</span>${d.provider ? ` <span class="tag">${esc(d.provider)}</span>` : ''}<p>${esc(strategyNote(d, pr ? pr.sum : 0, pr ? pr.first : null))}</p><p class="fine">${end ? `Abbezahlt ${esc(end)}${endB && endB !== end ? ` (statt ${esc(endB)})` : ''}.` : `Läuft über den Planungszeitraum hinaus.`}</p></div><span>${money(d.B0)}</span></li>`;
  }).join('')}</ol>` : '<p class="empty">Keine laufenden Ratenzahlungen.</p>';

  const months = P.opt.sum.monthly;
  const showOma = months.some(m => Math.abs(m.oma) > 0.005);
  const showFlex = months.some(m => m.flex > 0.005);
  const table = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Monat</th><th>Einnahmen</th><th>Fixkosten</th>${showFlex ? '<th>Flexibel</th>' : ''}<th>Raten</th><th>Rechnungen</th><th>Sondertilgung</th>${showOma ? '<th>Oma (netto)</th>' : ''}<th>Kontostand Ende</th><th>Schulden Ende</th></tr></thead><tbody>${months.map(m => `<tr><th>${esc(fmtMonthKey(m.key))}</th><td>${m.inc ? money(m.inc) : '–'}</td><td>${m.exp ? money(m.exp) : '–'}</td>${showFlex ? `<td>${m.flex > 0.005 ? money(m.flex) : '–'}</td>` : ''}<td>${m.rate ? money(m.rate) : '–'}</td><td>${m.inv ? money(m.inv) : '–'}</td><td>${m.prepay ? money(m.prepay) : '–'}</td>${showOma ? `<td>${Math.abs(m.oma) > 0.005 ? money(m.oma) : '–'}</td>` : ''}<td class="${m.end < 0 ? 'neg' : ''}">${money(m.end)}</td><td>${m.debt > 0.005 ? money(m.debt) : '–'}</td></tr>`).join('')}</tbody></table></div>`;

  const s = P.ctx.settings;
  return head + strip + `
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Zahlungsplan</h2><span class="muted">nächste 60 Tage</span></div>${stepsHTML}</section>
    <div class="stack">
      <section class="panel"><div class="panel-h"><h2>Rechnungen nach Frist</h2></div>${invHTML}</section>
      <section class="panel"><div class="panel-h"><h2>Raten nach Zinssatz</h2></div>${instHTML}</section>
    </div>
  </div>
  ${chartPanel}
  <section class="panel"><div class="panel-h"><h2>Monatsübersicht</h2></div>${table}</section>
  <section class="panel"><details class="fold open-flat"><summary>So rechnet die Strategie</summary>
    <ol class="rules">
      <li><b>Fristen sind tabu.</b> Jede Rechnung und jede Rate wird pünktlich bezahlt. Rechnungen überweist du ${s.payBufferDays} ${s.payBufferDays === 1 ? 'Tag' : 'Tage'} vor Fristende, damit die Zahlung rechtzeitig ankommt.</li>
      <li><b>Nie früher zahlen als nötig.</b> Rechnungen von PayPal, Klarna und Händlern kosten bis zur Frist nichts. Das Geld bleibt bis dahin auf deinem Konto und kann für teurere Schulden genutzt werden.</li>
      <li><b>Freies Geld geht in die teuerste Rate.</b> Frei ist nur, was nach allen Fixkosten, Raten und Rechnungen der kommenden ${s.horizonMonths} Monate über deinem Sicherheitspuffer von ${esc(fmtEUR(s.buffer))} bleibt. Zuerst wird die Rate mit dem höchsten Zinssatz getilgt, bei Gleichstand die kleinere Restschuld.</li>
      <li><b>Zinsfreie Raten laufen planmäßig.</b> Eine Sondertilgung spart hier nichts, dein Geld bleibt flexibel.</li>
      <li><b>Flexible Ausgaben sind fest eingeplant.</b> Monatsbudgets für Einkauf, Shopping und Freizeit werden als Monatsbetrag gerechnet und ${s.budgetMode === 'daily' ? 'gleichmäßig auf die Tage verteilt' : s.budgetMode === 'end' ? 'am Monatsende abgezogen' : 'zum Monatsanfang reserviert'}, im laufenden Monat nur der noch nicht ausgegebene Rest. Freies Geld ist, was danach noch übrig bleibt.</li>
      <li><b>Omas Geld bleibt unberührt.</b> Verkaufserlöse für Oma, die auf deinem Konto liegen, zählen nie als freies Geld. Auslagen für Oma gelten erst als verfügbar, wenn sie erstattet sind.</li>
      <li><b>Sondertilgungen gibt es höchstens einmal pro Geldeingang</b> (mindestens ${esc(fmtEUR(s.minPrepay))}), nicht täglich in kleinen Beträgen.</li>
    </ol>
    <p class="fine">Alle Zahlen sind eine Prognose auf Basis deiner Eingaben. Je aktueller Kontostand und Restschulden sind, desto verlässlicher ist der Plan.</p>
  </details></section>`;
}

function recurringRow(r) {
  const next = occurrences(r, dayNum(todayISO()), dayNum(todayISO()) + 400)[0];
  return `<li class="item compact"><div class="item-main"><div class="item-t"><b>${esc(r.name)}</b><span class="tag">${esc(r.category || '')}</span></div><div class="item-s">${esc(INTERVALS[r.interval] ? INTERVALS[r.interval].label : r.interval)}${next ? `, nächster Termin ${esc(fmtDate(fromDayNum(next)))}` : ', keine Termine mehr'}${r.end ? `, endet ${esc(fmtDate(r.end))}` : ''}</div></div>
    <div class="item-side"><div class="item-amt ${r.type === 'income' ? 'pos' : ''}">${money(r.type === 'income' ? r.amount : -r.amount)}</div><div class="item-btns"><button class="btn sm" data-act="editRecurring" data-id="${esc(r.id)}">Bearbeiten</button><button class="btn sm ghost" data-act="delRecurring" data-id="${esc(r.id)}">Löschen</button></div></div></li>`;
}

function viewFlows() {

  const stFlow = monthlyStats(st), net = sum(inc) - sum(exp) - stFlow.flex - stFlow.rates;
  const strip = `<div class="strip three">
    ${kpi('Einnahmen pro Monat', fmtEUR(sum(inc)), `${inc.length} ${inc.length === 1 ? 'Eintrag' : 'Einträge'}`, { cls: 'pos' })}

    </div>
    <div class="stack">
  <section class="panel"><div class="panel-h"><h2>Ausgaben</h2><span class="muted">${exp.length ? `${money(sum(exp))} pro Monat` : ''}</span></div>${exp.length ? `<ul class="items">${exp.sort(sortR).map(recurringRow).join('')}</ul>` : '<p class="empty">Noch keine Ausgaben. Miete, Strom, Versicherungen, Abos und Lebenshaltung gehören hierher.</p>'}</section>
    </div>
  </div>`;
}

function renderLock() {
  const app = $('#app');
  app.dataset.mode = 'lock';
  app.classList.remove('privacy');
  const has = !!Store.get();
  app.innerHTML = `<main class="lock"><div class="lock-card">
    <div class="brand big">${LOGO}<span>Kassensturz</span></div>
    <h1>${has ? 'Tresor entsperren' : 'Tresor anlegen'}</h1>
    <p class="lead">${has ? 'Gib dein Passwort ein, um dein Budget zu öffnen.' : 'Lege ein Passwort fest. Alle Daten werden damit verschlüsselt, bevor sie in diesem Browser gespeichert werden. Es verlässt nichts dein Gerät.'}</p>
    <form id="lockForm" novalidate>
      <label class="f"><span>${has ? 'Passwort' : 'Neues Passwort'}</span><input id="pw" type="password" autocomplete="${has ? 'current-password' : 'new-password'}" required autofocus></label>
      ${has ? '' : `<label class="f"><span>Passwort wiederholen</span><input id="pw2" type="password" autocomplete="new-password" required></label>
      <div class="meter" id="meter" data-n="0"><i></i><i></i><i></i><i></i><small id="pwLabel">Mindestens 8 Zeichen. Ein langer Satz ist besser als ein kurzes Passwort.</small></div>
      <label class="chk"><input type="checkbox" id="ack"><span>Mir ist klar: Wenn ich das Passwort vergesse, kann niemand die Daten wiederherstellen.</span></label>`}
      <p class="err" id="lockErr" role="alert"></p>
      <button class="btn primary block" type="submit" id="lockBtn">${has ? 'Entsperren' : 'Tresor anlegen'}</button>
    </form>
    <div class="lock-foot"><div><button class="link" data-act="syncLoad">Tresor aus GitHub laden (zweites Gerät)</button></div><div><button class="link" data-act="importBackup">Backup-Datei laden</button></div></div>
  </div></main>`;

  const form = $('#lockForm');
  if (!has) {
    $('#pw').addEventListener('input', () => {
      const s = passwordStrength($('#pw').value);
      $('#meter').dataset.n = $('#pw').value ? s.n : 0;
      $('#pwLabel').textContent = $('#pw').value ? `Stärke: ${s.label}` : 'Mindestens 8 Zeichen. Ein langer Satz ist besser als ein kurzes Passwort.';
    });
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#lockErr'), btn = $('#lockBtn');
    err.textContent = '';
    const pw = $('#pw').value;
    if (!pw) { err.textContent = 'Bitte Passwort eingeben.'; return; }
    if (!has) {
      if (pw.length < 8) { err.textContent = 'Das Passwort braucht mindestens 8 Zeichen.'; return; }
      if (pw !== $('#pw2').value) { err.textContent = 'Die beiden Passwörter stimmen nicht überein.'; return; }
      if (!$('#ack').checked) { err.textContent = 'Bitte bestätige den Hinweis zur Wiederherstellung.'; return; }
    }
    btn.disabled = true; btn.textContent = has ? 'Wird entsperrt …' : 'Wird verschlüsselt …';
    await new Promise(r => setTimeout(r, 30));
    try {
      if (has) await unlockVault(pw); else await createVault(pw);
      App.tab = 'home';
      armIdle();
      App.animateNext = true;
      render();
      Sync.start();
    } catch (ex) {
      err.textContent = ex.message || 'Das hat nicht geklappt.';
      btn.disabled = false; btn.textContent = has ? 'Entsperren' : 'Tresor anlegen';
      $('#pw').select();
    }
  });
}

function render() {
  const app = $('#app');
  if (!App.state) { renderLock(); return; }
  if (app.dataset.mode !== 'app' || !$('#view')) mountShell();
  const y = window.scrollY;
  const animate = !!App.animateNext; App.animateNext = false;
  $('#view').classList.toggle('anim', animate);
  $('#view').innerHTML = (App.preview ? previewBar() : '') + Views[App.tab]();
  $$('.rail [data-act=nav]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === App.tab ? 'page' : 'false'));
  app.classList.toggle('privacy', App.privacy);
  const pb = $('[data-act=privacy]'); if (pb) pb.setAttribute('aria-pressed', String(App.privacy));
  drawCharts();
  Fx.after(animate);
  const hook = AfterRender[App.tab]; if (hook) hook();
  window.scrollTo(0, y);
}

const byId = (list, id) => list.find(x => x.id === id);
const CATS_EXP = ['Wohnen', 'Lebensmittel', 'Mobilität', 'Versicherung', 'Abos & Medien', 'Freizeit', 'Gesundheit', 'Kinder & Familie', 'Kleidung', 'Sonstiges'];
const CATS_INC = ['Gehalt', 'Sonstige Einnahmen'];
const budgetNames = () => (App.state && App.state.budgets ? App.state.budgets.map(b => b.name) : []);
const catOptions = (type, cur) => {
  const a = type === 'income' ? [...CATS_INC] : [...budgetNames(), ...CATS_EXP.filter(c => !budgetNames().includes(c))];
  if (cur && !a.includes(cur)) a.push(cur);
  return a.map(c => [c, c]);
};
function setBalance(value) { App.state.settings.balance = round2(value); App.state.settings.balanceDate = todayISO(); }
function armIdle() {
  clearTimeout(App.idle);
  if (!App.state || App.preview) return;
  const m = Number(App.state.settings.lockMinutes) || 10;
  App.idle = setTimeout(lockVault, m * 60000);
}
let memTheme = null;
function currentTheme() {
  if (memTheme) return memTheme;
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function applyTheme() {
  const t = currentTheme();
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
}

function recurringForm(item) {
  const v = item || { type: 'expense', name: '', amount: '', interval: 'monthly', start: todayISO(), end: '', category: 'Wohnen' };
  openForm({
    title: item ? 'Eintrag bearbeiten' : 'Dauerauftrag oder Einnahme',
    values: v,
    fields: [
      { key: 'type', label: 'Art', type: 'select', half: true, options: [['expense', 'Ausgabe'], ['income', 'Einnahme']] },
      { key: 'name', label: 'Bezeichnung', type: 'text', half: true, required: true, placeholder: 'z. B. Miete, Gehalt' },
      { key: 'amount', label: 'Betrag', type: 'money', half: true, required: true },
      { key: 'interval', label: 'Rhythmus', type: 'select', half: true, options: Object.entries(INTERVALS).map(([k, x]) => [k, x.label]) },
      { key: 'start', label: 'Nächster Termin', type: 'date', half: true, required: true, hint: 'Der Tag im Monat gilt für alle Folgetermine.' },
      { key: 'end', label: 'Endet am (optional)', type: 'date', half: true },
      { key: 'category', label: 'Kategorie', type: 'select', options: catOptions(v.type, v.category) },
    ],
    onInput: (api, key) => { if (key === 'type') api.options('category', catOptions(api.get('type')), api.get('type') === 'income' ? 'Gehalt' : 'Wohnen'); },
    onSubmit: x => {
      if (!x.name) return 'Bitte eine Bezeichnung eingeben.';
      if (!(x.amount > 0)) return 'Bitte einen Betrag größer als 0 eingeben.';
      if (!validISO(x.start)) return 'Bitte den nächsten Termin wählen.';
      if (x.end && !validISO(x.end)) return 'Das Enddatum ist ungültig.';
      if (x.end && x.end < x.start) return 'Das Enddatum liegt vor dem Termin.';
      upsert(App.state.recurring, { id: item ? item.id : uid(), name: x.name, amount: round2(x.amount), type: x.type, category: x.category, interval: x.interval, start: x.start, end: x.end || '' });
      commit(); toast('Gespeichert');
    },
  });
}

function invoiceForm(item) {
  const today = todayISO();
  const v = item || { name: '', provider: '', amount: '', purchaseDate: today, termDays: 30, due: fromDayNum(dayNum(today) + 30) };
  const touched = { term: !!item };
  const recompute = api => {
    const p = api.get('purchaseDate'), t = api.get('termDays');
    if (validISO(p) && t >= 0) api.set('due', fromDayNum(dayNum(p) + t));
  };
  const preview = api => {
    const due = api.get('due');
    if (!validISO(due)) { api.preview(''); return; }
    const set = App.state.settings;
    const pay = Math.max(dayNum(todayISO()), dayNum(due) - (Number(set.payBufferDays) || 0));
    api.preview(`<p>Geplante Überweisung: <b>${esc(fmtDate(fromDayNum(pay)))}</b>. Spätestens fällig: <span class="mark">${esc(fmtDate(due))}</span>.</p>`);
  };
  openForm({
    title: item ? 'Rechnung bearbeiten' : 'Kauf auf Rechnung',
    values: v,
    fields: [
      { key: 'name', label: 'Bezeichnung', type: 'text', required: true, placeholder: 'z. B. Sneaker, Kopfhörer' },
      { key: 'provider', label: 'Anbieter', type: 'text', half: true, list: ['PayPal', 'Klarna', 'Händler', 'Sonstige'], placeholder: 'PayPal, Klarna …' },
      { key: 'amount', label: 'Betrag', type: 'money', half: true, required: true },
      { key: 'purchaseDate', label: 'Kauf- oder Rechnungsdatum', type: 'date', half: true },
      { key: 'termDays', label: 'Zahlungsziel in Tagen', type: 'number', half: true, hint: 'Bei PayPal und Klarna oft 30 Tage ab Rechnung. Bitte mit deiner Rechnung abgleichen.' },
      { key: 'due', label: 'Spätestens fällig am', type: 'date', required: true, hint: 'Das maximale Zahlungsziel. Die App plant die Zahlung kurz davor, nie später.' },
    ],
    onInput: (api, key) => {
      if (key === 'provider' && !touched.term && /paypal|klarna/i.test(api.get('provider'))) { api.set('termDays', 30); recompute(api); }
      if (key === 'termDays') { touched.term = true; recompute(api); }
      if (key === 'purchaseDate') recompute(api);
      if (key === 'due') { const p = api.get('purchaseDate'), d = api.get('due'); if (validISO(p) && validISO(d)) api.set('termDays', dayNum(d) - dayNum(p)); }
      preview(api);
    },
    onSubmit: x => {
      if (!x.name) return 'Bitte eine Bezeichnung eingeben.';
      if (!(x.amount > 0)) return 'Bitte einen Betrag größer als 0 eingeben.';
      if (!validISO(x.due)) return 'Bitte das Fälligkeitsdatum wählen.';
      upsert(App.state.invoices, {
        id: item ? item.id : uid(), name: x.name, provider: x.provider, amount: round2(x.amount),
        purchaseDate: validISO(x.purchaseDate) ? x.purchaseDate : '', termDays: Number.isFinite(x.termDays) ? x.termDays : null,
        due: x.due, paid: item ? !!item.paid : false, paidDate: item ? item.paidDate : '',
      });
      commit(); toast('Gespeichert');
    },
  });
}

function installmentForm(item) {
  const today = todayISO();
  const v = item || { name: '', provider: '', balance: '', payment: '', rate: 0, nextDue: fromDayNum(dayNum(today) + 14), allowPrepay: true };
  const preview = api => {
    const x = api.all();
    if (!(x.balance > 0) || !(x.payment > 0)) { api.preview(''); return; }
    const r = Number.isFinite(x.rate) ? x.rate : 0;
    const am = amortize(x.balance, x.payment, r);
    if (!am.ok) { api.preview('<p><b>Achtung:</b> Die Rate deckt die monatlichen Zinsen nicht. Die Schuld würde nie sinken.</p>'); return; }
    const end = validISO(x.nextDue) ? fmtDate(addMonths(x.nextDue, am.months - 1)) : null;
    api.preview(`<p>Laufzeit: <b>${am.months} Raten</b>${end ? ` bis ${esc(end)}` : ''}. Zinsen insgesamt ca. <b>${esc(fmtEUR(am.interest))}</b>.</p>`);
  };
  openForm({
    title: item ? 'Ratenzahlung bearbeiten' : 'Ratenzahlung',
    values: v,
    fields: [
      { key: 'name', label: 'Bezeichnung', type: 'text', required: true, placeholder: 'z. B. Waschmaschine' },
      { key: 'provider', label: 'Anbieter', type: 'text', half: true, list: ['Klarna', 'PayPal', 'Händler', 'Bank'], placeholder: 'Klarna, Händler …' },
      { key: 'balance', label: 'Restschuld heute', type: 'money', half: true, required: true, hint: 'Betrag, den du heute zur vollständigen Tilgung zahlen müsstest.' },
      { key: 'payment', label: 'Monatliche Rate', type: 'money', half: true, required: true },
      { key: 'rate', label: 'Zinssatz pro Jahr', type: 'percent', half: true, hint: '0 bei zinsfreier Ratenzahlung, sonst der effektive Jahreszins aus dem Vertrag.' },
      { key: 'nextDue', label: 'Nächste Rate fällig am', type: 'date', required: true },
      { key: 'allowPrepay', label: 'Sondertilgung ist erlaubt', type: 'checkbox', hint: 'Vorzeitig zurückzahlen, ohne dass der Anbieter dafür extra Gebühren verlangt. Im Zweifel in den Vertragsbedingungen nachsehen.' },
    ],
    onInput: (api) => preview(api),
    onSubmit: x => {
      if (!x.name) return 'Bitte eine Bezeichnung eingeben.';
      if (!(x.balance > 0)) return 'Bitte die Restschuld eingeben.';
      if (!(x.payment > 0)) return 'Bitte die monatliche Rate eingeben.';
      const rate = Number.isFinite(x.rate) ? x.rate : 0;
      if (rate < 0 || rate > 100) return 'Der Zinssatz muss zwischen 0 und 100 liegen.';
      if (!validISO(x.nextDue)) return 'Bitte das Datum der nächsten Rate wählen.';
      const keepAnchor = item && item.nextDue === x.nextDue && item.anchorDay;
      upsert(App.state.installments, {
        id: item ? item.id : uid(), name: x.name, provider: x.provider, balance: round2(x.balance), payment: round2(x.payment),
        rate, nextDue: x.nextDue, anchorDay: keepAnchor ? item.anchorDay : parseISO(x.nextDue).d, allowPrepay: !!x.allowPrepay,
      });
      commit(); toast('Gespeichert');
    },
  });
}

function quickForm() {
  const today = todayISO();
  openForm({
    title: 'Schnell-Erfassung', wide: true, submit: 'Gültige Zeilen übernehmen',
    intro: `<p>Eine Zeile pro Posten, getrennt durch Semikolon.</p>
      <p class="code"><b>R</b>; Name; Betrag; Fällig; Anbieter <span class="muted">(Rechnung)</span><br><b>Z</b>; Name; Restschuld; Rate; Zins %; Nächste Fälligkeit; Anbieter <span class="muted">(Ratenzahlung)</span></p>
      <p class="muted">Datum als 24.11.2026, 24.11. oder +30 (in 30 Tagen). Ohne Jahr gilt das nächste Vorkommen.</p>`,
    values: { text: '' },
    fields: [{ key: 'text', label: 'Posten', type: 'textarea', rows: 7, placeholder: 'R; Sneaker; 89,90; 24.11.2026; Klarna\nR; Kopfhörer; 129; +30; PayPal\nZ; Waschmaschine; 540; 45; 0; 05.12.2026; Klarna\nZ; Sofa; 1200; 80; 9,9; 01.12.2026; Händler' }],
    onInput: api => {
      const rows = parseQuickLines(api.get('text'), today);
      if (!rows.length) { api.preview(''); return; }
      api.preview(`<ul class="qp">${rows.map(r => r.error
        ? `<li class="bad"><b>Zeile ${r.line}:</b> ${esc(r.error)}</li>`
        : r.kind === 'invoice'
          ? `<li class="ok"><b>Rechnung</b> ${esc(r.item.name)}, ${esc(fmtEUR(r.item.amount))}, fällig ${esc(fmtDate(r.item.due))}${r.item.provider ? `, ${esc(r.item.provider)}` : ''}</li>`
          : `<li class="ok"><b>Ratenzahlung</b> ${esc(r.item.name)}, Rest ${esc(fmtEUR(r.item.balance))}, Rate ${esc(fmtEUR(r.item.payment))}, ${esc(fmtPct(r.item.rate))}, ab ${esc(fmtDate(r.item.nextDue))}</li>`).join('')}</ul>`);
    },
    onSubmit: x => {
      const rows = parseQuickLines(x.text, today);
      const good = rows.filter(r => !r.error);
      if (!good.length) return 'Keine gültige Zeile gefunden.';
      for (const r of good) {
        if (r.kind === 'invoice') App.state.invoices.push({ id: uid(), paid: false, paidDate: '', ...r.item });
        else App.state.installments.push({ id: uid(), anchorDay: parseISO(r.item.nextDue).d, ...r.item });
      }
      commit();
      toast(`${good.length} ${good.length === 1 ? 'Eintrag' : 'Einträge'} übernommen${rows.length > good.length ? `, ${rows.length - good.length} Zeile(n) übersprungen` : ''}`);
    },
  });
}

/* ---------- Backup ---------- */
function chooseFile(cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => { if (inp.files && inp.files[0]) cb(inp.files[0]); });
  inp.click();
}

async function exportBackup() {
  App.state.settings.lastBackup = todayISO();
  await persist();
  const rec = JSON.stringify(await sealRecord(stripSync(App.state), App.key, App.salt, App.iter));   // ohne Sync-Token
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rec], { type: 'application/json' }));
  a.download = `kassensturz-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Verschlüsseltes Backup gespeichert');
  render();
}

function importBackup(file) {
  file.text().then(text => {
    let rec;
    try { rec = JSON.parse(text); checkRecord(rec); } catch (e) { toast(e.message && !/JSON/.test(e.message) ? e.message : 'Das ist keine gültige Backup-Datei.', 'bad'); return; }
    openForm({
      title: 'Backup importieren', submit: 'Importieren',
      intro: `<p>Gib das Passwort ein, mit dem das Backup verschlüsselt wurde.${App.state ? ' <b>Deine aktuellen Daten in diesem Browser werden ersetzt.</b>' : ''}</p>`,
      fields: [{ key: 'pw', label: 'Passwort des Backups', type: 'password', auto: 'current-password', required: true }],
      onSubmit: async x => {
        const r = await openRecord(rec, x.pw);
        Object.assign(App, { state: r.state, key: r.key, salt: r.salt, iter: r.iter, plan: null, tab: 'home' });
        Store.set(JSON.stringify(rec));
        armIdle(); render(); Sync.start(); toast('Backup importiert');
      },
    });
  }).catch(() => toast('Die Datei konnte nicht gelesen werden.', 'bad'));
}

const SETTINGS_FIELDS = [
  { key: 'buffer', label: 'Sicherheitspuffer', type: 'money', half: true, hint: 'Dieser Betrag bleibt immer auf dem Konto und wird nie für Sondertilgungen verwendet.' },
  { key: 'payBufferDays', label: 'Rechnungen überweisen', type: 'number', half: true, hint: 'So viele Tage vor Fristende. 2 bis 3 Tage sind sicher, falls die Überweisung länger braucht.' },
  { key: 'minPrepay', label: 'Kleinste Sondertilgung', type: 'money', half: true, hint: 'Kleinere Beträge werden nicht vorgeschlagen.' },
  { key: 'horizonMonths', label: 'Planungszeitraum', type: 'select', half: true, options: [[12, '12 Monate'], [24, '24 Monate'], [36, '36 Monate']] },
  { key: 'budgetMode', label: 'Budgets in der Prognose', type: 'select', options: [['start', 'Zum Monatsanfang reservieren'], ['end', 'Zum Monatsende abziehen'], ['daily', 'Gleichmäßig auf die Tage verteilen']], hint: 'Wann die Prognose den Monatsbetrag vom Konto abzieht. Am Monatsanfang ist das Geld für den ganzen Monat reserviert, das ist die vorsichtigste Variante.' },
  { key: 'trackStart', label: 'Erfassungsstart', type: 'date', half: true, hint: 'Buchungen und Oma-Vorgänge werden ab diesem Datum geführt (Historie).' },
  { key: 'lockMinutes', label: 'Automatisch sperren nach', type: 'select', half: true, options: [[2, '2 Minuten'], [5, '5 Minuten'], [10, '10 Minuten'], [30, '30 Minuten'], [60, '1 Stunde']] },
];

function bindSettings() {
  const form = $('#settingsForm');
  if (!form) return;
  form.addEventListener('submit', e => {
    e.preventDefault();
    const x = readFields(form, SETTINGS_FIELDS);
    const err = $('#serr');
    if (!(x.buffer >= 0)) { err.textContent = 'Der Sicherheitspuffer muss 0 oder mehr sein.'; return; }
    if (!(x.payBufferDays >= 0 && x.payBufferDays <= 14)) { err.textContent = 'Die Überweisungs-Vorlaufzeit liegt zwischen 0 und 14 Tagen.'; return; }
    if (!(x.minPrepay >= 1)) { err.textContent = 'Die kleinste Sondertilgung muss mindestens 1 € betragen.'; return; }
    if (!validISO(x.trackStart)) { err.textContent = 'Bitte einen gültigen Erfassungsstart wählen.'; return; }
    Object.assign(App.state.settings, { buffer: round2(x.buffer), payBufferDays: Math.round(x.payBufferDays), minPrepay: round2(x.minPrepay), horizonMonths: Number(x.horizonMonths), lockMinutes: Number(x.lockMinutes), trackStart: x.trackStart, budgetMode: ['start', 'end', 'daily'].includes(x.budgetMode) ? x.budgetMode : 'start' });
    if (typeof App.range === 'number' && App.range > App.state.settings.horizonMonths) App.range = App.state.settings.horizonMonths;
    armIdle(); commit(); toast('Einstellungen gespeichert');
  });
}

function changePasswordForm() {
  openForm({
    title: 'Passwort ändern', submit: 'Passwort ändern',
    fields: [
      { key: 'old', label: 'Aktuelles Passwort', type: 'password', auto: 'current-password', required: true },
      { key: 'pw', label: 'Neues Passwort', type: 'password', auto: 'new-password', required: true },
      { key: 'pw2', label: 'Neues Passwort wiederholen', type: 'password', auto: 'new-password', required: true },
    ],
    onInput: api => { const p = api.get('pw'); api.preview(p ? `<p>Stärke: <b>${esc(passwordStrength(p).label)}</b></p>` : ''); },
    onSubmit: async x => {
      if (x.pw.length < 8) return 'Das neue Passwort braucht mindestens 8 Zeichen.';
      if (x.pw !== x.pw2) return 'Die neuen Passwörter stimmen nicht überein.';
      await saveChain;
      try { await openRecord(JSON.parse(Store.get()), x.old); } catch (e) { return 'Das aktuelle Passwort stimmt nicht.'; }
      if (Sync.enabled() && !(await Sync.run('pre'))) return 'Gleiche zuerst ab (Internetverbindung nötig), damit keine Änderungen vom anderen Gerät verloren gehen.';
      const salt = crypto.getRandomValues(new Uint8Array(16));
      App.key = await deriveKey(x.pw, salt, KDF_ITER); App.salt = salt; App.iter = KDF_ITER;
      if (App.state.sync) App.state.sync.pwChanged = true;
      await persist();
      if (Sync.enabled()) Sync.run('manual');
      toast('Passwort geändert. Alte Backups gelten weiter mit dem alten Passwort.' + (Sync.enabled() ? ' Auf dem anderen Gerät wirst du beim nächsten Abgleich nach dem neuen Passwort gefragt.' : ''));
    },
  });
}

function wipeForm() {

  range(d) { App.range = d.m === 'cur' || d.m === 'next' ? d.m : Number(d.m); render(); },

  lock() { lockVault(); },
  theme(d) { memTheme = d.v; if (!App.preview) { try { localStorage.setItem(THEME_KEY, d.v); } catch (e) { /* ignorieren */ } } applyTheme(); render(); },

    });
  },
  addRecurring() { recurringForm(null); },
